<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>JSSA管理画面</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,sans-serif;background:#f3f4f6;color:#1f2937;min-height:100vh;font-size:14px}
.login-wrap{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px}
.login-card{background:#fff;border-radius:16px;padding:40px 36px;max-width:380px;width:100%;box-shadow:0 4px 24px rgba(0,0,0,.12)}
.login-logo{text-align:center;margin-bottom:28px}
.login-badge{background:#639922;color:#fff;font-weight:800;font-size:14px;padding:4px 14px;border-radius:5px;margin-right:8px}
.login-title{font-size:18px;font-weight:700;color:#0B0F1A;display:inline}
.login-sub{font-size:13px;color:#6b7280;text-align:center;margin-bottom:24px}
.field-label{display:block;font-size:12px;font-weight:700;color:#4b5563;margin-bottom:6px}
input[type=password]{width:100%;padding:11px 14px;border:1.5px solid #e5e7eb;border-radius:8px;font-size:14px;outline:none;margin-bottom:16px}
input[type=password]:focus{border-color:#639922}
.btn-login{width:100%;padding:13px;background:#0B0F1A;color:#fff;border:none;border-radius:8px;font-size:15px;font-weight:700;cursor:pointer}
.login-err{color:#dc2626;font-size:13px;margin-top:8px;display:none;text-align:center}
.main-wrap{display:none;min-height:100vh}
header{background:#000F1A;padding:0;position:sticky;top:0;z-index:100}
.hdr{max-width:1100px;margin:0 auto;padding:12px 24px;display:flex;align-items:center;justify-content:space-between}
.logo{display:flex;align-items:center;gap:10px}
.logo-badge{background:#639922;color:#fff;font-weight:800;font-size:12px;padding:3px 10px;border-radius:4px}
.logo-text{color:#fff;font-size:14px;font-weight:500}
.btn-logout{background:rgba(255,255,255,0.1);border:1px solid rgba(255,255,255,0.2);border-radius:6px;padding:6px 14px;font-size:12px;color:rgba(255,255,255,0.7);cursor:pointer}
.container{max-width:1100px;margin:0 auto;padding:24px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:24px}
.stat-card{background:#fff;border-radius:12px;padding:20px;text-align:center;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.stat-num{font-size:28px;font-weight:800;color:#1f2937}
.stat-num.orange{color:#f59e0b}
.stat-num.green{color:#10b981}
.stat-num.red{color:#ef4444}
.stat-label{font-size:12px;color:#6b7280;margin-top:4px}
.tabs{display:flex;gap:8px;margin-bottom:20px;align-items:center;flex-wrap:wrap}
.tab{padding:8px 18px;border-radius:8px;border:none;font-size:13px;font-weight:600;cursor:pointer;background:#fff;color:#6b7280;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.tab.active{background:#0B0F1A;color:#fff}
.tab-trash{background:#fff;color:#ef4444;border:1px solid #fecaca}
.tab-trash.active{background:#ef4444;color:#fff}
.btn-refresh{background:#639922;color:#fff;border:none;border-radius:8px;padding:8px 16px;font-size:12px;font-weight:600;cursor:pointer}
.empty{text-align:center;padding:60px;color:#9ca3af}
.card{background:#fff;border-radius:12px;padding:20px;margin-bottom:12px;box-shadow:0 1px 4px rgba(0,0,0,.06);border:1px solid #e5e7eb}
.card-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:12px}
.card-title{font-size:15px;font-weight:700;color:#0B0F1A}
.card-sub{font-size:12px;color:#6b7280;margin-top:2px}
.badge{display:inline-block;font-size:11px;font-weight:700;padding:3px 10px;border-radius:20px}
.badge-new{background:#fef3c7;color:#92400e}
.badge-done{background:#d1fae5;color:#065f46}
.badge-ng{background:#fee2e2;color:#991b1b}
.badge-trash{background:#fce7f3;color:#9d174d}
.card-body{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.info-item .label{font-size:11px;color:#9ca3af}
.info-item .value{font-size:13px;color:#374151;font-weight:500}
.msg-box{background:#f9fafb;border-radius:8px;padding:12px;font-size:12px;color:#374151;line-height:1.6;margin-bottom:12px;border:1px solid #e5e7eb}
.reason-box{background:#f0f9e8;border-radius:8px;padding:12px;font-size:12px;color:#374151;line-height:1.6;margin-bottom:12px;border:1px solid #c0dd97}
.select-toolbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.applicant-profile{background:#eef6ff;border:1px solid #bfdbfe;border-radius:8px;padding:10px 12px;margin-bottom:12px;font-size:11px;color:#1e3a5f}
.applicant-profile .ap-title{font-size:11px;font-weight:700;color:#1d4ed8;margin-bottom:6px}
.applicant-profile .ap-row{display:flex;flex-wrap:wrap;gap:4px 16px;line-height:1.8}
.applicant-profile b{color:#0B0F1A}
.applicant-profile.empty{color:#6b7280;font-style:italic}
.sel-btns{display:flex;gap:6px}
.sel-btn{background:#fff;border:1px solid #d1d5db;border-radius:6px;padding:4px 10px;font-size:11px;color:#374151;cursor:pointer}
.sel-btn:hover{background:#f3f4f6}
.sel-btn:disabled{opacity:.5;cursor:default}
.sel-count{font-size:11px;color:#6b7280;font-weight:600}
.company-detail-list{display:flex;flex-direction:column;gap:8px;margin-bottom:10px}
.company-card{background:#f9fafb;border:1px solid #e5e7eb;border-radius:8px;padding:10px 12px}
.company-card-head{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.company-card-head input[type=checkbox]{width:16px;height:16px;flex-shrink:0;accent-color:#639922;cursor:pointer}
.company-card-name{font-size:13px;font-weight:700;color:#0B0F1A;cursor:pointer}
.company-card-body{font-size:11px;color:#374151;line-height:1.7}
.company-card-body .cc-row{display:flex;flex-wrap:wrap;gap:4px 14px}
.company-card-body b{color:#111827}
.company-card .reason-box{margin-top:6px}
.load-more-btn{width:100%;background:#fff;border:1px dashed #9ca3af;border-radius:8px;padding:10px;font-size:12px;color:#374151;cursor:pointer;margin-bottom:10px}
.load-more-btn:hover{background:#f3f4f6}
.load-more-btn:disabled{opacity:.6;cursor:default}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.btn-approve{background:#0B0F1A;color:#fff;border:none;border-radius:8px;padding:10px 18px;font-size:13px;font-weight:600;cursor:pointer;flex:1}
.btn-approve:hover{background:#639922}
.btn-decline{background:#fff;color:#ef4444;border:1px solid #fecaca;border-radius:8px;padding:10px 18px;font-size:13px;font-weight:600;cursor:pointer}
.btn-decline:hover{background:#fee2e2}
.btn-delete{background:#fff;color:#9ca3af;border:1px solid #e5e7eb;border-radius:8px;padding:10px 14px;font-size:13px;cursor:pointer}
.btn-delete:hover{background:#fee2e2;color:#ef4444;border-color:#fecaca}
.btn-restore{background:#639922;color:#fff;border:none;border-radius:8px;padding:10px 18px;font-size:13px;font-weight:600;cursor:pointer}
.detail-wrap{display:none;background:#fff;border-radius:12px;padding:24px;margin-bottom:12px;box-shadow:0 2px 8px rgba(0,0,0,.1);border:2px solid #0B0F1A}
.detail-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
.detail-title{font-size:18px;font-weight:700;color:#0B0F1A}
.btn-close{background:#f3f4f6;border:none;border-radius:6px;padding:6px 12px;font-size:12px;cursor:pointer}
.edit-label{font-size:12px;font-weight:700;color:#4b5563;margin-bottom:6px;display:block}
textarea{width:100%;border:1.5px solid #e5e7eb;border-radius:8px;padding:10px 12px;font-size:13px;color:#374151;outline:none;resize:vertical;font-family:inherit}
textarea:focus{border-color:#639922}
.char-count{text-align:right;font-size:11px;color:#9ca3af;margin-top:3px}
.from-box{background:#f0f9e8;border:1px solid #c0dd97;border-radius:8px;padding:12px;margin-bottom:16px}
.from-label{font-size:11px;color:#639922;font-weight:700;margin-bottom:6px}
.from-info{font-size:12px;color:#374151;line-height:2}
.detail-actions{display:flex;gap:10px;margin-top:16px}
.btn-send{flex:2;background:#639922;border:none;border-radius:8px;padding:12px;font-size:14px;font-weight:700;color:#fff;cursor:pointer}
.btn-send:hover{background:#3B6D11}
.btn-send:disabled{background:#9ca3af;cursor:not-allowed}
.btn-cancel{flex:1;background:#fff;border:1px solid #e5e7eb;border-radius:8px;padding:12px;font-size:13px;color:#6b7280;cursor:pointer}
.trash-note{background:#fef3c7;border:1px solid #fde68a;border-radius:8px;padding:10px 14px;font-size:12px;color:#92400e;margin-bottom:16px}
/* AI情報補完 */
.tab-enrich{border-color:#c7d2fe}
.enrich-wrap{background:#fff;border:1px solid #e5e7eb;border-radius:14px;padding:24px}
.enrich-wrap h3{font-size:17px;margin:0 0 6px}
.enrich-lead{font-size:13px;color:#4b5563;line-height:1.8;margin:0 0 18px}
.enrich-range{display:flex;flex-wrap:wrap;gap:10px;align-items:center;font-size:13px;margin-bottom:14px}
.enrich-range input[type=number]{width:110px;padding:8px 10px;border:1px solid #d1d5db;border-radius:8px;font-size:14px}
.enrich-range label{display:flex;gap:6px;align-items:center}
.enrich-actions{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:16px}
.enrich-actions button{padding:10px 18px;border-radius:8px;font-size:14px;font-weight:700;cursor:pointer;border:1px solid #d1d5db;background:#fff}
.enrich-actions .primary{background:#639922;color:#fff;border-color:#639922}
.enrich-actions button:disabled{opacity:.5;cursor:not-allowed}
.enrich-summary{font-size:14px;margin-bottom:10px}
.enrich-bar{height:10px;background:#f3f4f6;border-radius:6px;overflow:hidden;margin-bottom:14px}
.enrich-bar>div{height:100%;width:0;background:#639922;transition:width .3s}
.enrich-log{max-height:420px;overflow:auto;border:1px solid #f3f4f6;border-radius:8px}
.enrich-log table{width:100%;border-collapse:collapse;font-size:12px}
.enrich-log th,.enrich-log td{padding:7px 9px;border-bottom:1px solid #f3f4f6;text-align:left;vertical-align:top}
.enrich-log th{background:#f9fafb;position:sticky;top:0}
.enrich-ok{color:#15803d}.enrich-ng{color:#dc2626}.enrich-web{font-size:11px;color:#6b7280}
.mem-table{width:100%;border-collapse:collapse;font-size:12px;min-width:520px}
.mem-table th,.mem-table td{padding:6px 8px;border-bottom:1px solid #f3f4f6;text-align:left;vertical-align:top}
.mem-table th{background:#f9fafb;font-weight:700;color:#4b5563}
.mem-row{cursor:pointer}.mem-row:hover td{background:#f9fafb}
.mem-detail td{background:#f9fafb;color:#4b5563}
.mt{display:inline-block;font-size:11px;font-weight:700;padding:1px 8px;border-radius:10px;margin:2px 2px 2px 0}
.mt.ok{background:#DCFCE7;color:#166534}.mt.ng{background:#FEE2E2;color:#991B1B}.mt.na{background:#F3F4F6;color:#6B7280}
</style>
</head>
<body>
<div class="login-wrap" id="login-wrap">
  <div class="login-card">
    <div class="login-logo"><span class="login-badge">JSSA</span><span class="login-title">管理画面</span></div>
    <p class="login-sub">事務局専用 — パスワードを入力してください</p>
    <label class="field-label">パスワード</label>
    <input type="password" id="pw" placeholder="パスワードを入力" onkeydown="if(event.key==='Enter')doLogin()">
    <button class="btn-login" onclick="doLogin()">ログイン →</button>
    <div class="login-err" id="login-err">パスワードが違います</div>
  </div>
</div>
<div class="main-wrap" id="main-wrap">
  <header>
    <div class="hdr">
      <div class="logo"><span class="logo-badge">JSSA</span><span class="logo-text">管理画面　事務局専用</span></div>
      <button class="btn-logout" onclick="logout()">ログアウト</button>
    </div>
  </header>
  <div class="container">
    <div class="stats">
      <div class="stat-card"><div class="stat-num" id="stat-total">0</div><div class="stat-label">合計依頼数</div></div>
      <div class="stat-card"><div class="stat-num orange" id="stat-new">0</div><div class="stat-label">未処理</div></div>
      <div class="stat-card"><div class="stat-num green" id="stat-done">0</div><div class="stat-label">推薦メール送信済み</div></div>
      <div class="stat-card"><div class="stat-num red" id="stat-ng">0</div><div class="stat-label">却下</div></div>
    </div>
    <div class="tabs">
      <button class="tab active" onclick="setTab('matches')">📋 マッチング結果</button>
      <button class="tab" onclick="setTab('progress')">📈 進捗</button>
      <button class="tab" onclick="setTab('all')">ユーザー返信</button>
      <button class="tab" onclick="setTab('new')">未処理</button>
      <button class="tab" onclick="setTab('done')">推薦メール送信済み</button>
      <button class="tab" onclick="setTab('ng')">却下</button>
      <button class="tab tab-trash" onclick="setTab('trash')">🗑 ゴミ箱</button>
      <button class="tab" onclick="setTab('sent')">📤 送信履歴</button>
      <button class="tab tab-enrich" onclick="setTab('enrich')">🤖 AI情報補完</button>
      <button class="btn-refresh" onclick="currentTab==='enrich'?renderEnrichPanel():currentTab==='sent'?loadSent(true):currentTab==='progress'?loadProgress():currentTab==='matches'?loadMatchResults():loadRequests()">🔄 更新</button>
    </div>
    <div id="detail-area"></div>
    <div id="cards-area"><div class="empty">読み込み中...</div></div>
  </div>
</div>
<script>
let adminPassword='';
let allRequests=[];
let trashItems=[];
let matchBatches=[];
let currentTab='matches';
let isDetailOpen=false;
let autoRefreshTimer=null;

function doLogin(){
  const pw=document.getElementById('pw').value;
  if(!pw){return;}
  adminPassword=pw;
  document.getElementById('login-err').style.display='none';
  loadMatchResults().then(()=>loadRequests(true)); // 件数表示とユーザー返信タブ用に、リクエストも読み込んでおく
}

function logout(){
  adminPassword='';
  allRequests=[];
  trashItems=[];
  document.getElementById('main-wrap').style.display='none';
  document.getElementById('login-wrap').style.display='flex';
  document.getElementById('pw').value='';
  clearAutoRefresh();
}

function startAutoRefresh(){
  clearAutoRefresh();
  autoRefreshTimer=setInterval(()=>{
    if(!isDetailOpen)loadRequests(true);
  },30000);
}

function clearAutoRefresh(){
  if(autoRefreshTimer){clearInterval(autoRefreshTimer);autoRefreshTimer=null;}
}

async function loadRequests(silent=false){
  try{
    const res=await fetch('/.netlify/functions/admin-api',{method:'POST',headers:{'Content-Type':'application/json','x-admin-password':adminPassword},body:JSON.stringify({action:'list'})});
    const data=await res.json();
    if(!data.success){
      if(data.error==='認証失敗'){document.getElementById('login-err').style.display='block';return;}
      if(!silent)alert('エラー: '+data.error);return;
    }
    allRequests=data.requests||[];
    document.getElementById('login-wrap').style.display='none';
    document.getElementById('main-wrap').style.display='block';
    updateStats();
    renderCards();
    if(currentTab==='progress'&&!silent&&!isDetailOpen)loadProgress();
    startAutoRefresh();
  }catch(e){
    if(!silent)alert('通信エラー: '+e.message);
  }
}

async function loadMatchResults(){
  try{
    const res=await fetch('/.netlify/functions/admin-api',{method:'POST',headers:{'Content-Type':'application/json','x-admin-password':adminPassword},body:JSON.stringify({action:'getMatchResults'})});
    const data=await res.json();
    if(!data.success){alert('エラー: '+data.error);return;}
    matchBatches=data.batches||[];
    document.getElementById('login-wrap').style.display='none';
    document.getElementById('main-wrap').style.display='block';
    renderCards();
  }catch(e){alert('通信エラー: '+e.message);}
}

let selectedCompanies={}; // batchId -> Set(rowIndex)
let loadedDetails={}; // batchId -> [{rowIndex, company, department, ... , matchReason, recommendation}]

// ===== 同じ会社の社員（名刺）を1枚のカードにまとめる =====
let expandedGroups={}; // `${batchId}|${groupKey}` -> 全社員を表示中
function companyKey(v){
  // 会社の照合用キー：全角半角・大文字小文字・スペース・「・」や記号・法人格（株式会社、Co., Ltd.、Inc. など）の違いを無視する
  const s=String(v||'').normalize('NFKC').toLowerCase();
  const k=s.replace(/株式会社|有限会社|合同会社|合資会社|合名会社|一般社団法人|一般財団法人|公益社団法人|公益財団法人|有限責任|\(株\)|\(有\)|\(同\)|㈱|㈲/g,'')
    .replace(/(^|[^a-z0-9])(co\.?\s*,?\s*ltd|company\s+limited|limited|ltd|inc|incorporated|corporation|corp|llc|l\.l\.c|k\.k|g\.k)\.?(?=[^a-z0-9]|$)/g,'$1')
    .replace(/[\s・･,，.。\-‐－–—_'’"“”()「」『』&＋+]/g,'');
  return k||s.replace(/\s+/g,'');
}
function coNorm(c){return companyKey(c);}
function cardTimeF(v){const m=String(v||'').normalize('NFKC').match(/(\d{4})\D+(\d{1,2})(?:\D+(\d{1,2}))?/);if(m)return Date.UTC(+m[1],+m[2]-1,+(m[3]||1));const s=String(v||'').trim();if(/^\d{5}$/.test(s))return Date.UTC(1899,11,30)+parseInt(s,10)*86400000;return 0;}
function batchGroups(batch){
  const m=new Map();
  for(const it of (batch.companies||[])){const k=coNorm(it.targetCompany);if(!m.has(k))m.set(k,{key:k,company:it.targetCompany,items:[]});m.get(k).items.push(it);}
  return [...m.values()];
}
let batchFilters={}; // batchId -> {query, rows:Set(rowIndex)}
function visibleGroups(batch){
  const f=batchFilters[batch.batchId];const gs=batchGroups(batch);
  return f?gs.filter(g=>g.items.some(it=>f.rows.has(it.rowIndex))):gs;
}
async function searchBatch(batchId){
  const batch=matchBatches.find(b=>b.batchId===batchId);if(!batch)return;
  const input=document.getElementById(`search-${batchId}`);const q=(input?input.value:'').trim();
  if(!q){clearBatchSearch(batchId);return;}
  const btn=document.getElementById(`searchbtn-${batchId}`);if(btn){btn.disabled=true;btn.textContent='検索中…';}
  try{
    const res=await fetch('/.netlify/functions/admin-api',{method:'POST',headers:{'Content-Type':'application/json','x-admin-password':adminPassword},body:JSON.stringify({action:'searchBatch',keywords:q.split(/[\s　、，,・／/]+/),items:(batch.companies||[]).map(it=>({rowIndex:it.rowIndex,company:it.targetCompany,cardRow:it.cardRow}))})});
    const data=await res.json();
    if(!data.success){alert(data.error||'検索に失敗しました');}
    else{batchFilters[batchId]={query:q,rows:new Set(data.rowIndexes)};}
  }catch(e){alert('エラー: '+e.message);}
  renderCards();
}
function clearBatchSearch(batchId){delete batchFilters[batchId];delete allSearch[batchId];renderCards();}

// ===== 名刺データ全体から検索して、候補に追加する =====
let allSearch={}; // batchId -> {query,total,companies,selected:Set}
async function searchAllCards(batchId){
  const batch=matchBatches.find(b=>b.batchId===batchId);if(!batch)return;
  const input=document.getElementById(`search-${batchId}`);const q=(input?input.value:'').trim();
  if(!q){alert('検索キーワードを入力してください');return;}
  const btn=document.getElementById(`searchallbtn-${batchId}`);if(btn){btn.disabled=true;btn.textContent='検索中…';}
  try{
    const res=await fetch('/.netlify/functions/admin-api',{method:'POST',headers:{'Content-Type':'application/json','x-admin-password':adminPassword},body:JSON.stringify({action:'searchAllCards',keywords:q.split(/[\s　、，,・／/]+/),userId:batch.userId,batchId})});
    const data=await res.json();
    if(!data.success)alert(data.error||'検索に失敗しました');
    else allSearch[batchId]={query:q,total:data.total,companies:data.companies,selected:new Set()};
  }catch(e){alert('エラー: '+e.message);}
  renderCards();
}
function toggleAllSearchPick(batchId,idx,checked){const s=allSearch[batchId];if(!s)return;checked?s.selected.add(idx):s.selected.delete(idx);const el=document.getElementById(`allpickcount-${batchId}`);if(el)el.textContent=`${s.selected.size}社を選択中`;}
async function addPickedToBatch(batchId){
  const s=allSearch[batchId];if(!s||!s.selected.size){alert('追加する会社を選んでください');return;}
  const names=[...s.selected].map(i=>s.companies[i].company);
  const btn=document.getElementById(`addpicked-${batchId}`);if(btn){btn.disabled=true;btn.textContent='追加中…';}
  try{
    const res=await fetch('/.netlify/functions/admin-api',{method:'POST',headers:{'Content-Type':'application/json','x-admin-password':adminPassword},body:JSON.stringify({action:'addToBatch',batchId,companies:names})});
    const data=await res.json();
    if(!data.success){alert(data.error||'追加に失敗しました');if(btn){btn.disabled=false;btn.textContent='選んだ会社を候補に追加';}return;}
    delete allSearch[batchId];
    await loadMatchResults();
    const batch=matchBatches.find(b=>b.batchId===batchId);
    const keys=new Set(names.map(coNorm));

// 10社ずつ表示。AIの処理時間（26秒の上限）に収まるよう、5社ずつ2つのリクエストに分けて同時に読み込む
const LOAD_COMPANIES=10, CHUNK_COMPANIES=5;
async function fetchCompanyChunk(batch,groups){
  const items=groups.flatMap(g=>g.items);
  const res=await fetch('/.netlify/functions/admin-api',{method:'POST',headers:{'Content-Type':'application/json','x-admin-password':adminPassword},body:JSON.stringify({action:'getCompanyDetails',items:items.map(it=>({company:it.targetCompany,score:it.score,cardRow:it.cardRow})),aiParams:batch.aiParams||{},applicant:{company:batch.userCompany,name:batch.userName,profile:batch.userProfile||{}}})});
  const text=await res.text();
  let data;try{data=JSON.parse(text);}catch(e){throw new Error('時間切れ（もう一度押してください）');}
  if(!data.success)throw new Error(data.error||'取得に失敗しました');
  return data.companies.map((c,i)=>({...c,rowIndex:items[i].rowIndex,groupKey:coNorm(items[i].targetCompany)}));
}
async function loadNextCompanies(batchId){
  const batch=matchBatches.find(b=>b.batchId===batchId);
  if(!batch)return;
  const loaded=loadedDetails[batchId]||[];
  const groups=visibleGroups(batch);
  const loadedKeys=new Set(loaded.map(c=>c.groupKey));
  const nextGroups=groups.filter(g=>!loadedKeys.has(g.key)).slice(0,LOAD_COMPANIES);
  if(nextGroups.length===0)return;
  const remainLabel=()=>{const n=groups.filter(g=>loadedKeys.has(g.key)).length;return n===0?`詳細を表示（先頭${LOAD_COMPANIES}社）`:`次の${LOAD_COMPANIES}社を表示（残り${groups.length-n}社）`;};
  const btn=document.getElementById(`loadmore-${batchId}`);
  if(btn){btn.disabled=true;btn.textContent='読み込み中…（AIが推薦理由を生成しています）';}
  const chunks=[];for(let k=0;k<nextGroups.length;k+=CHUNK_COMPANIES)chunks.push(nextGroups.slice(k,k+CHUNK_COMPANIES));
  const results=await Promise.allSettled(chunks.map(ch=>fetchCompanyChunk(batch,ch)));
  // 読み込めた分は表示する（順番を保つため、失敗したかたまり以降は次回に回す）
  let merged=[];let failed=null;
  for(const r of results){if(r.status==='fulfilled'&&!failed)merged=merged.concat(r.value);else if(r.status!=='fulfilled'&&!failed)failed=r.reason;}
  if(merged.length){loadedDetails[batchId]=[...loaded,...merged];renderCards();}
  if(failed){
    alert('一部の企業を読み込めませんでした：'+(failed.message||failed)+'\n「次の'+LOAD_COMPANIES+'社を表示」をもう一度押してください。');
    if(!merged.length&&btn){btn.disabled=false;btn.textContent=remainLabel();}
  }
}

// 1行分の各段階の日時と「次にやること」を決める
function buildProg(row){
  const b=row.batch||{},q=row.req||null;
  const st=[];const done=v=>({at:v||'',done:!!v});
  st[0]=done(b.createdAt);
  st[1]=done(b.sentAt);
  let next=null,closed=null,who='';
  if(row.type==='batch'){
    st[2]=done('');st[3]=done('');st[4]=done('');st[5]=done('');st[6]=done('');
    if(b.closed){closed=b.closed.state||'終了';}
    else if(!b.sentAt){next={i:1,label:'企業を選定して提案する',mine:true};}
    else{next={i:2,label:'会員の返信待ち',mine:false};}
  }else{
    st[2]=done(q.createdAt);
    const recDone=q.recAt||(q.status==='推薦メール送信済'?'済':'');
    st[3]=done(recDone);
    st[4]={at:q.answerAt||'',done:!!q.answer,val:q.answer};
    st[5]=done(q.threeAt);st[6]=done(q.doneAt);
    if(!st[1].done&&st[2].done)st[1]={at:'済',done:true};
    if(q.status==='見送り'&&!recDone){closed='見送り（事務局）';}
    else if(q.doneAt){closed='完了';}
    else if(q.answer==='NG'){closed='紹介先NG';}
    else if(!recDone){next={i:3,label:'推薦メールを送る',mine:true};}
    else if(!q.answer){next={i:4,label:'紹介先の回答待ち',mine:false};}
    else if(!q.threeAt){next={i:5,label:'3者メールを送る',mine:true};}
    else{next={i:6,label:'完了にする',mine:true};}
  }
  // 直前に終わった段階からの経過日数
  let lastAt='';for(const x of st){if(x.done&&x.at&&x.at!=='済')lastAt=x.at;}
  const member=row.type==='batch'?row.member:{userId:q.userId,company:q.memberCompany,name:q.memberName,email:q.memberEmail};
  return{row,st,next,closed,member,lastAt};
}
function progDays(at){const t=Date.parse(at);if(isNaN(t))return null;return Math.floor((progNow-t)/86400000);}
function progFmt(at){if(!at)return'';if(at==='済')return'済';const t=Date.parse(at);if(isNaN(t))return at;return new Date(t+9*3600*1000).toISOString().slice(5,16).replace('T',' ').replace('-','/');}

    ${list.length?`<div style="overflow-x:auto;border:1px solid #e5e7eb;border-radius:10px"><table style="width:100%;border-collapse:collapse;font-size:13px;min-width:1000px"><thead><tr style="background:#f9fafb;font-size:11px;color:#6b7280"><th style="padding:8px;text-align:left">会員</th><th style="padding:8px;text-align:left">紹介先</th>${PSTAGES.map(x=>`<th style="padding:8px;text-align:left;white-space:nowrap">${x}</th>`).join('')}<th style="padding:8px;text-align:left">次にやること</th></tr></thead><tbody>${list.map(p=>{const q=p.row.req,b=p.row.batch||{};const target=q?`<b>${esc(q.targetCompany)}</b>${q.recTo?`<br><span style="font-size:11px;color:#6b7280">${esc(q.recTo.replace(/（.*）/,''))}</span>`:''}`:(b.designated?`<span style="font-size:12px">🎯 ${esc(b.designated)}（指定）</span>`:`<span style="font-size:12px;color:#6b7280">${b.sentCount?`${b.sentCount}社を提案済み`:`候補${b.total||0}社から選定`}${b.priority&&b.priority!=='こだわらない'?`／${esc(b.priority==='両方'?'スポンサー・顧問':b.priority)}`:''}</span>`);return`<tr style="border-top:1px solid #f3f4f6"><td style="padding:8px"><b>${esc(p.member.company)}</b><br><span style="font-size:12px">${esc(p.member.name)}</span></td><td style="padding:8px">${target}</td>${[0,1,2,3,4,5,6].map(i=>cell(p,i)).join('')}<td style="padding:6px">${p.next?`<div style="font-size:12px;font-weight:700;margin-bottom:2px;color:${p.next.mine?'#c2410c':'#475569'}">${esc(p.next.label)}</div>`:''}${actions(p)}</td></tr>`;}).join('')}</tbody></table></div>`:'<div class="empty">該当する案件はありません</div>'}

async function setProg(k,field,value){
  const p=progRows[k];if(!p||!p.row.req)return;
  const label=field==='answer'?(value==='OK'?'紹介先から「面談OK」の回答があった':'紹介先から「NG」の回答があった'):field==='three'?'3者メールを送信した':'この案件を完了にする';
  if(!confirm(`${p.member.company} ${p.member.name}様 → ${p.row.req.targetCompany}\n「${label}」として記録しますか？`))return;
  await progCall({action:'setProgress',rowIndex:p.row.req.rowIndex,field,value});
}
async function undoProg(k,i){
  const p=progRows[k];if(!p||!p.row.req)return;
  const field=i===4?'answer':i===5?'three':'done';
  if(!confirm(`「${PSTAGES[i]}」の記録を取り消しますか？`))return;
  await progCall({action:'setProgress',rowIndex:p.row.req.rowIndex,field,value:''});
}
async function closeProgBatch(k,state){
  const p=progRows[k];if(!p)return;
  if(state&&!confirm(`${p.member.company} ${p.member.name}様の申込みを「終了」にして、進捗一覧の対応中から外しますか？（「完了・終了」で確認でき、戻すこともできます）`))return;
  await progCall({action:'closeBatch',batchId:p.row.batch.batchId,state});
}

async function findDuplicates(){

    const g=data.groups||[];

let nvGroups=[],nvStop=false;
function nvRow(g,i){

function nvRender(){
  const log=document.getElementById('nv-log');
  log.innerHTML=nvGroups.length?`<table><thead><tr><th></th><th>種類</th><th>見つかった表記</th><th>残す表記</th><th>結果</th></tr></thead><tbody>${nvGroups.map(nvRow).join('')}</tbody></table>`:'';

function nvSync(){document.querySelectorAll('.nv-chk').forEach(c=>{nvGroups[c.dataset.i].checked=c.checked;});document.querySelectorAll('.nv-to').forEach(c=>{nvGroups[c.dataset.i].to=c.value;});}
function nvSelectAll(v){nvSync();nvGroups.forEach(g=>{if(!g.done)g.checked=v;});nvRender();}
async function findNameVariants(){
  const sum=document.getElementById('nv-summary');sum.textContent='名刺データを確認しています…';
  nvGroups=[];nvStop=false;nvRender();
  try{
    const res=await fetch('/.netlify/functions/collect-company-info',{method:'POST',headers:{'Content-Type':'application/json','x-admin-password':adminPassword},body:JSON.stringify({action:'findNameGroups'})});
    const data=await res.json();
    if(!data.success){sum.textContent='エラー：'+(data.error||'確認できませんでした');return;}
    // ① 規則で見つかった表記ゆれ（多く使われている表記を残す候補にし、最初からチェックしておく）
    nvGroups=data.ruleGroups.map(g=>({type:'rule',names:g.names,to:g.names[0].name,checked:true}));
    nvRender();
    const latinCount=new Map((data.latin||[]).map(x=>[x.name,x.count]));const latin=(data.latin||[]).map(x=>x.name);
    sum.innerHTML=`表記ゆれ：<b>${nvGroups.length}組</b>。続けて英語表記の会社（${latin.length}社）の日本語名をAIで確認しています…`;
    // ② 英語表記の会社を40社ずつ、2つ同時にAIで確認する
    document.getElementById('nv-stop').disabled=false;
    const chunks=[];for(let i=0;i<latin.length;i+=40)chunks.push(latin.slice(i,i+40));
    let done=0,found=0;
    for(let i=0;i<chunks.length;i+=2){
      if(nvStop)break;
      const pair=chunks.slice(i,i+2);
      const results=await Promise.all(pair.map(async names=>{for(let t=0;t<2;t++){try{const r=await fetch('/.netlify/functions/collect-company-info',{method:'POST',headers:{'Content-Type':'application/json','x-admin-password':adminPassword},body:JSON.stringify({action:'matchLatinNames',names})});const d=JSON.parse(await r.text());if(d.success)return d.pairs;}catch(e){}}return[];}));
      nvSync();
      results.flat().forEach(p=>{
        // 同じ日本語表記がすでに一覧にあれば、その組に英語表記を足す
        const g=nvGroups.find(x=>x.type==='ai'&&x.to===p.japanese);
        if(g){if(!g.names.some(n=>n.name===p.english))g.names.push({name:p.english,count:latinCount.get(p.english)||1});return;}
        nvGroups.push({type:'ai',names:[{name:p.japanese,count:p.jaCount},{name:p.english,count:latinCount.get(p.english)||1}],to:p.japanese,checked:false,note:p.exact?'':`AIの回答：${p.ai}（名称が一部違うため要確認）`});found++;
      });
      done+=pair.reduce((a,c)=>a+c.length,0);
      nvRender();
      document.getElementById('nv-bar').style.width=(latin.length?done/latin.length*100:100)+'%';
      sum.innerHTML=`表記ゆれ：<b>${nvGroups.filter(g=>g.type==='rule').length}組</b>／英語↔日本語：<b>${found}組</b>（英語表記の会社 ${done} / ${latin.length}社を確認）`;
    }
    document.getElementById('nv-stop').disabled=true;
    sum.innerHTML+=`<br>${nvStop?'停止しました。':'確認が終わりました。'}英語↔日本語の組はAIの判断なので、内容を確認してからチェックしてください。`;
  }catch(e){sum.textContent='エラー：'+e.message;document.getElementById('nv-stop').disabled=true;}
}
async function applyNameUnify(){
  nvSync();
  const targets=nvGroups.map((g,i)=>({g,i})).filter(x=>x.g.checked&&!x.g.done);
  if(!targets.length){alert('統一する組にチェックを入れてください。');return;}
  if(!confirm(`${targets.length}組の会社名を、選んだ表記に統一します。名刺データとマッチング結果シートの会社名が書き換わります。よろしいですか？`))return;
  document.getElementById('nv-apply').disabled=true;
  let ok=0,cards=0;
  for(const {g,i} of targets){
    const cell=document.querySelector(`#nv-row-${i} .nv-st`);if(cell)cell.textContent='統一中…';
    try{
      const res=await fetch('/.netlify/functions/collect-company-info',{method:'POST',headers:{'Content-Type':'application/json','x-admin-password':adminPassword},body:JSON.stringify({action:'unifyNames',from:g.names.map(n=>n.name),to:g.to})});
      const d=await res.json();
      if(!d.success)throw new Error(d.error||'失敗');
      g.done=true;g.checked=false;ok++;cards+=d.cards;
      if(cell)cell.innerHTML=`<span class="enrich-ok">✓ 名刺${d.cards}枚・記録${d.results}件</span>`;
      const chk=document.querySelector(`#nv-row-${i} .nv-chk`);if(chk){chk.checked=false;chk.disabled=true;}
    }catch(e){if(cell)cell.innerHTML=`<span class="enrich-ng">${enrichEsc(e.message)}</span>`;}
  }
  document.getElementById('nv-apply').disabled=false;
  document.getElementById('nv-summary').innerHTML+=`<br><b>${ok}組を統一しました（名刺${cards}枚を書き換え）。</b>`;
}

async function classifyChunk(names){
  for(let t=0;t<2;t++){
    try{
      const res=await fetch('/.netlify/functions/collect-company-info',{method:'POST',headers:{'Content-Type':'application/json','x-admin-password':adminPassword},body:JSON.stringify({action:'classify',companies:names})});
      const text=await res.text();const data=JSON.parse(text);
      if(data.success)return data.results;
    }catch(e){}
  }
  return null;
}
async function startClassify(){
  if(!clsTargets.length)return;
  if(!confirm(`${clsTargets.length}社をAIで分類します。時間がかかるので、終わるまでこの画面を開いたままにしてください。よろしいですか？`))return;
  clsRunning=true;clsStop=false;
  document.getElementById('cls-start').disabled=true;document.getElementById('cls-stop').disabled=false;
  const sum=document.getElementById('cls-summary');const log=document.getElementById('cls-log');
  const chunks=[];for(let i=0;i<clsTargets.length;i+=20)chunks.push(clsTargets.slice(i,i+20));
  let done=0,failed=0;const counts={};
  log.innerHTML='<table><thead><tr><th>会社</th><th>属性</th><th>業種詳細</th></tr></thead><tbody id="cls-tbody"></tbody></table>';
  const tbody=document.getElementById('cls-tbody');
  for(let i=0;i<chunks.length;i+=2){
    if(clsStop)break;
    const pair=chunks.slice(i,i+2);
    const results=await Promise.all(pair.map(classifyChunk));
    results.forEach((r,k)=>{
      if(!r){failed+=pair[k].length;return;}
      r.forEach(x=>{counts[x.attribute]=(counts[x.attribute]||0)+1;});
      tbody.insertAdjacentHTML('afterbegin',r.map(x=>`<tr><td>${enrichEsc(x.company)}</td><td>${enrichEsc(x.attribute)}</td><td>${enrichEsc((x.industries||[]).join('／'))}</td></tr>`).join(''));
    });
    done+=pair.reduce((a,c)=>a+c.length,0);
    while(tbody.children.length>200)tbody.removeChild(tbody.lastChild);
    document.getElementById('cls-bar').style.width=(done/clsTargets.length*100)+'%';
    sum.innerHTML=`${done} / ${clsTargets.length}社を処理（失敗 ${failed}社）`;
  }
  clsRunning=false;document.getElementById('cls-stop').disabled=true;
  sum.innerHTML=`${clsStop?'停止しました':'完了しました'}：${done-failed}社を分類（失敗 ${failed}社）。<br>属性の内訳：${Object.entries(counts).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`${enrichEsc(k)} ${v}社`).join('、')}<br>失敗した会社や停止した残りは、もう一度「未分類の会社を探す」から再実行できます。`;
}

}

// 名刺交換日を「2025年5月1日」の形式で表示する（読めない形式はそのまま、空欄は「未登録」）
function formatCardDate(v){
  const s=String(v||'').normalize('NFKC').trim();
  if(!s)return '未登録';
  if(/^#+$/.test(s))return '要確認（シートの値が「###」）';
  const m=s.match(/(\d{4})\D+(\d{1,2})(?:\D+(\d{1,2}))?/);
  if(m)return `${m[1]}年${parseInt(m[2],10)}月${m[3]?parseInt(m[3],10)+'日':''}`;
  if(/^\d{5}$/.test(s)){const d=new Date(Date.UTC(1899,11,30)+parseInt(s,10)*86400000);return `${d.getUTCFullYear()}年${d.getUTCMonth()+1}月${d.getUTCDate()}日`;}
  return s;
}

// 保存時刻（UTC）を日本時間の日付「2026-09-25」と時刻「14:05」で表示する
function jstParts(iso){const d=new Date(iso);if(!iso||isNaN(d))return null;const j=new Date(d.getTime()+9*3600*1000);const p=n=>String(n).padStart(2,'0');return{date:`${j.getUTCFullYear()}-${p(j.getUTCMonth()+1)}-${p(j.getUTCDate())}`,time:`${p(j.getUTCHours())}:${p(j.getUTCMinutes())}`};}
function jstDate(iso){const x=jstParts(iso);return x?x.date:(iso?String(iso).slice(0,10):'');}
function jstTime(iso){const x=jstParts(iso);return x?x.time:'--:--';}

function setTab(tab){
  currentTab=tab;
  const ctn=document.querySelector('.container');if(ctn)ctn.style.maxWidth=tab==='progress'?'1440px':'';
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  if(typeof event!=='undefined'&&event.target)event.target.classList.add('active');
  document.getElementById('detail-area').innerHTML='';
  isDetailOpen=false;
  if(tab==='enrich'){renderEnrichPanel();return;}
  if(tab==='sent'){renderSentPanel();return;}
  if(tab==='progress'){loadProgress();return;}
  if(tab==='trash'){loadTrash();}
  else if(tab==='matches'){loadMatchResults();}
  else{renderCards();loadRequests(true);} // タブを開くたびに最新のリクエストを読み込む
}

        <div class="actions" style="margin-top:6px">
          <button class="sel-btn" onclick='changeMemberRank(${JSON.stringify(b).replace(/'/g,"&#39;")})'>🎖 会員ランクを変更（現在: ${b.memberRank||'default'}）</button>
          <button class="sel-btn" style="color:#991b1b;border-color:#fca5a5" onclick="deleteBatch('${b.batchId}')">🗑 このマッチング結果を削除</button>
          <button class="sel-btn" style="color:#991b1b;border-color:#fca5a5" onclick='deactivateUser(${JSON.stringify(b).replace(/'/g,"&#39;")})'>🚫 このユーザーを退会処理する</button>
        </div>
      </div>`;
    }).join('');
    return;
  }
  if(currentTab==='trash'){
    if(trashItems.length===0){area.innerHTML='<div class="empty">ゴミ箱は空です</div>';return;}
    area.innerHTML=trashItems.map(r=>`
      <div class="card">
        <div class="card-head">
          <div><div class="card-title">🗑 ${r.targetCompany||'—'}</div><div class="card-sub">${r.targetPosition||''} | 削除日時: ${r.deletedAt?r.deletedAt.slice(0,10):''}</div></div>
          <span class="badge badge-trash">ゴミ箱</span>
        </div>
        <div class="card-body">
          <div class="info-item"><div class="label">依頼者</div><div class="value">${r.memberCompany||'—'} ${r.memberName||''}</div></div>
          <div class="info-item"><div class="label">元ステータス</div><div class="value">${r.status||'—'}</div></div>
          <div class="info-item"><div class="label">依頼日時</div><div class="value">${r.createdAt?r.createdAt.slice(0,10):''}</div></div>
        </div>
        <div class="trash-note">このリクエストはゴミ箱に移動されました。復元または完全削除できます。</div>
        <div class="actions">
          <button class="btn-restore" onclick='restoreRequest(${JSON.stringify(r).replace(/'/g,"&#39;")})'>↩ 復元</button>
        </div>
      </div>`).join('');
    return;
  }
  let filtered=allRequests;
  if(currentTab==='new')filtered=allRequests.filter(r=>r.status==='リクエスト受付'||r.status==='未処理');
  else if(currentTab==='done')filtered=allRequests.filter(r=>r.status==='推薦メール送信済');
  else if(currentTab==='ng')filtered=allRequests.filter(r=>r.status==='見送り');
  const inboundBar=(currentTab==='all'||currentTab==='new')?`<div style="margin-bottom:12px"><button class="sel-btn" onclick="openInbound()">📥 受信した返信メールを確認・再処理</button><div id="inbound-panel"></div></div>`:'';
  if(filtered.length===0){area.innerHTML=inboundBar+'<div class="empty">該当する依頼はありません</div>';return;}
  const getBadge=(s)=>{
    if(s==='リクエスト受付'||s==='未処理')return'<span class="badge badge-new">⏳ 未処理</span>';
    if(s==='推薦メール送信済')return'<span class="badge badge-done">📨 推薦メール送信済み</span>';
    if(s==='見送り')return'<span class="badge badge-ng">❌ 見送り</span>';
    return`<span class="badge">${s}</span>`;
  };
  // 会員の返信本文には「<tok@…>」などメールの引用記号が入るため、必ずエスケープして表示する（そのまま入れると以降のボタンが表示されなくなる）
  const hx=v=>String(v==null?'':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  window._reqCards=filtered;
  area.innerHTML=inboundBar+filtered.map((r,i)=>`
    <div class="card">
      <div class="card-head">
        <div><div class="card-title">${hx(r.targetCompany||'—')}</div><div class="card-sub">${hx(r.targetPosition||'')} | ${r.createdAt?hx(r.createdAt.slice(0,10)):''}</div></div>
        ${getBadge(r.status)}
      </div>
      <div class="card-body">
        <div class="info-item"><div class="label">依頼者会社</div><div class="value">${hx(r.memberCompany||'—')}</div></div>
        <div class="info-item"><div class="label">依頼者名</div><div class="value">${hx(r.memberName||'—')}</div></div>
        <div class="info-item"><div class="label">依頼者メール</div><div class="value">${hx(r.memberEmail||'—')}</div></div>
        <div class="info-item"><div class="label">依頼日時</div><div class="value">${r.createdAt?hx(r.createdAt.slice(0,10)):''}</div></div>
      </div>
      ${r.matchReason?`<div class="reason-box">🎯 ${hx(r.matchReason)}</div>`:''}
      ${r.message?`<div class="msg-box" style="white-space:pre-wrap;max-height:160px;overflow:auto">${hx(r.message)}</div>`:''}
      <div class="actions">
        ${r.status==='推薦メール送信済'?`<button class="btn-approve" style="background:#639922" onclick="openThreeWay(${r.rowIndex})">🤝 3者メール（お繋ぎ）を作成</button><button class="btn-decline" style="color:#6b7280;border-color:#d1d5db" onclick="openDetail(window._reqCards[${i}])">🔁 推薦メール再送</button>`:`<button class="btn-approve" onclick="openDetail(window._reqCards[${i}])">✅ 担当者選択・推薦メール</button>`}
        <button class="btn-decline" onclick="doDecline(window._reqCards[${i}])">❌ 見送り</button>
        <button class="btn-delete" onclick="doDelete(window._reqCards[${i}])" title="ゴミ箱へ">🗑</button>
      </div>
    </div>`).join('');
}

const hxs=v=>String(v==null?'':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let currentDetailReq=null;
function openDetail(r){
  // 推薦メールを送信済みのリクエストは、二重送信を防ぐため確認してから開く
  if(r&&r.status==='推薦メール送信済'&&!confirm(`「${r.targetCompany||''}」には、すでに推薦メールを送信済みです。\n\nもう一度送りますか？（送ると紹介先に同じ推薦メールが2通届きます）`))return;
  isDetailOpen=true;
  currentDetailReq=r;
  const area=document.getElementById('detail-area');
  area.innerHTML=`<div class="detail-wrap" id="detail-box" style="display:block">
    <div class="detail-head"><div class="detail-title">📨 推薦メール送信：${hxs(r.targetCompany||'')}</div><button class="btn-close" onclick="closeDetail()">✕ 閉じる</button></div>
    <div class="from-box"><div class="from-label">✅ 申請者情報</div><div class="from-info">
      <div><b>会社名：</b>${hxs(r.memberCompany||'—')}</div>
      <div><b>氏名　：</b>${hxs(r.memberName||'—')}</div>
      <div><b>メール：</b>${hxs(r.memberEmail||'—')}</div>
      ${r.matchReason?`<div style="margin-top:8px;color:#639922;font-weight:600">🎯 ${hxs(r.matchReason)}</div>`:''}
      ${r.recommendation?`<div style="margin-top:4px;color:#374151">${hxs(r.recommendation)}</div>`:''}
    </div></div>
    <label class="edit-label">① 送信先の役職者を選択</label>
    <select id="contact-select" onchange="onContactChange()" style="width:100%;padding:10px;border-radius:8px;border:1px solid #d1d5db;font-size:13px;margin-bottom:12px">
      <option value="">読み込み中...</option>
    </select>
    <label class="edit-label">会員（${hxs(r.memberCompany||'')}）の事業概要 <span id="ov-src" style="font-weight:400;font-size:12px;color:#6b7280">読み込み中…</span></label>
    <textarea id="ov-edit" rows="3" placeholder="事業概要を読み込み中…" style="width:100%;box-sizing:border-box;padding:10px;border-radius:8px;border:1px solid #d1d5db;font-size:13px"></textarea>
    <div style="display:flex;gap:8px;align-items:center;margin:4px 0 14px;flex-wrap:wrap">
      <button type="button" onclick="saveMemberOverview()" style="padding:6px 12px;border-radius:6px;border:1px solid #639922;background:#f0f7e6;color:#3b6212;font-size:12px;cursor:pointer">💾 この事業概要を保存して本文に反映</button>
      <span id="ov-msg" style="font-size:12px;color:#6b7280">保存すると、ユーザー登録シートのAC列に記録され、次回からこの文章が使われます。</span>
    </div>
    <label class="edit-label">② メッセージ（自動生成・編集可能）</label>
    <textarea id="edit-msg" rows="12"></textarea>
    <div class="char-count" id="edit-char">0/2000</div>
    <div style="font-size:12px;color:#6b7280;margin:-4px 0 12px">※送信時に、本文の末尾へ岡代表の署名（イベント予定・協会情報）が自動で付きます。</div>
    <div class="detail-actions">
      <button class="btn-cancel" onclick="closeDetail()">キャンセル</button>
      <button class="btn-send" id="btn-send" onclick='sendRecommendation(${JSON.stringify(r).replace(/'/g,"&#39;")})'>📨 推薦メールを送信する</button>
    </div>
  </div>`;
  document.getElementById('edit-msg').oninput=function(){document.getElementById('edit-char').textContent=this.value.length+'/2000';};
  area.scrollIntoView({behavior:'smooth'});
  currentMemberOverview={website:'',overview:'',meetingBenefit:'',loaded:false};
  loadCompanyContacts(r);
  loadMemberOverview(r);
}

let currentMemberOverview={website:'',overview:'',meetingBenefit:'',loaded:false};

async function loadMemberOverview(r){
  if(!r.userId)return;
  try{
    const res=await fetch('/.netlify/functions/admin-api',{method:'POST',headers:{'Content-Type':'application/json','x-admin-password':adminPassword},body:JSON.stringify({action:'getMemberOverview',userId:r.userId,targetCompany:r.targetCompany,matchReason:r.matchReason})});
    const data=await res.json();
    if(data.success){
      currentMemberOverview={website:data.website||'',overview:data.overview||'',meetingBenefit:data.meetingBenefit||'',loaded:true};
      const ov=document.getElementById('ov-edit');if(ov)ov.value=data.overview||'';
      const srcEl=document.getElementById('ov-src');
      if(srcEl)srcEl.textContent=data.overviewSource==='saved'?'（保存済みの文章）':data.overviewSource==='website'?'（会社HPの内容から自動作成。内容を確認し、違っていれば直して保存してください）':'（HPから読み取れませんでした。入力して保存してください）';
      const sel=document.getElementById('contact-select');
      const idx=sel?sel.value:'';
      const contact=(idx!==''&&currentContacts[idx])?currentContacts[idx]:null;
      buildDefaultMsg(r,contact);
    }
  }catch(e){console.error('loadMemberOverview error:',e);}
}

async function saveMemberOverview(){
  const r=currentDetailReq;if(!r||!r.userId){alert('会員IDが不明なため保存できません');return;}
  const ov=document.getElementById('ov-edit');const text=(ov?ov.value:'').trim();
  if(!text){alert('事業概要を入力してください');return;}
  const msgEl=document.getElementById('ov-msg');msgEl.textContent='保存中…';
  try{
    const res=await fetch('/.netlify/functions/admin-api',{method:'POST',headers:{'Content-Type':'application/json','x-admin-password':adminPassword},body:JSON.stringify({action:'saveMemberOverview',userId:r.userId,overview:text})});
    const data=await res.json();
    if(!data.success){msgEl.textContent='保存できませんでした：'+(data.error||'');return;}
    currentMemberOverview.overview=text;
    const ta=document.getElementById('edit-msg');
    if(ta){ta.value=ta.value.replace(/^事業概要：.*$/m,'事業概要：'+text.replace(/\n/g,' '));document.getElementById('edit-char').textContent=ta.value.length+'/2000';}
    msgEl.textContent='✅ 保存し、本文の「事業概要」を差し替えました。';
    document.getElementById('ov-src').textContent='（保存済みの文章）';
  }catch(e){msgEl.textContent='保存エラー：'+e.message;}
}

let currentContacts=[];

async function loadCompanyContacts(r){
  const sel=document.getElementById('contact-select');
  try{
    const res=await fetch('/.netlify/functions/admin-api',{method:'POST',headers:{'Content-Type':'application/json','x-admin-password':adminPassword},body:JSON.stringify({action:'getCompanyContacts',targetCompany:r.targetCompany})});
    const data=await res.json();
    currentContacts=(data.success?data.contacts:[])||[];
    if(currentContacts.length===0){
      sel.innerHTML='<option value="">該当する担当者データが見つかりません（手動でメール本文にメールアドレスを追記してください）</option>';
      buildDefaultMsg(r,null);
      return;
    }
    sel.innerHTML=currentContacts.map((c,i)=>`<option value="${i}">${c.prefecture||'地域不明'}／${c.cardDate?c.cardDate+'交換':'交換日不明'}／${c.name||'（氏名不明）'}／${c.position||'役職不明'}／${c.email||'メール不明'}</option>`).join('');
    sel.value='0';
    buildDefaultMsg(r,currentContacts[0]);
  }catch(e){
    sel.innerHTML='<option value="">読み込みエラー</option>';
  }
}

// 送信先の役職者を選び直したら、本文の冒頭の宛名（会社名・役職・氏名）を差し替える（それ以外の編集内容はそのまま残す）
function addressBlockFor(r,contact){
  const toName=contact?.name||'';
  const toPosition=contact?.position||r.targetPosition||'';
  return `${r.targetCompany||''}\n${toPosition||'ご担当者'}\n${toName?toName+'様':'ご担当者様'}`;
}
function onContactChange(){
  const r=currentDetailReq;if(!r)return;
  const sel=document.getElementById('contact-select');
  const idx=sel.value;
  const contact=idx!==''?currentContacts[idx]:null;
  const ta=document.getElementById('edit-msg');
  const cur=ta?ta.value:'';
  const cut=cur.indexOf('\n\n');
  if(ta&&cut>0){
    ta.value=addressBlockFor(r,contact)+cur.slice(cut);
    document.getElementById('edit-char').textContent=ta.value.length+'/2000';
    ta.style.transition='background .6s';ta.style.background='#fef9c3';setTimeout(()=>{ta.style.background='';},700);
  }else buildDefaultMsg(r,contact);
}

function buildDefaultMsg(r,contact){
  const toName=contact?.name||'';
  const toPosition=contact?.position||r.targetPosition||'';
  const addressBlock=addressBlockFor(r,contact);
  const memberName=r.memberName||'—';
  const memberCompany=r.memberCompany||'—';
  const introLine=r.matchReason
    ?`このたび、弊協会の会員企業である${memberCompany}の${memberName}様より、貴社との面談・情報交換をご希望いただきました。\n${memberName}様は${r.matchReason}との接点を求めておられ、ぜひ貴社をご紹介させていただきたく、ご連絡いたしました。`
    :`このたび、弊協会の会員企業である${memberCompany}の${memberName}様より、貴社との面談・情報交換をご希望いただきましたので、ご紹介させていただきたくご連絡いたしました。`;
  const overview=currentMemberOverview.loaded?(currentMemberOverview.overview||'（情報なし）'):'（事業概要を生成中です…）';
  const website=currentMemberOverview.loaded?(currentMemberOverview.website||'（未登録）'):'（読み込み中…）';
  const meetingBenefit=currentMemberOverview.loaded?(currentMemberOverview.meetingBenefit||'（情報なし）'):'（面談メリットを生成中です…）';
  const defaultMsg=`${addressBlock}\n\nいつもお世話になっております。日本スタートアップ支援協会（JSSA）の岡隆宏です。\n${introLine}\n\n【ご紹介する会員】\n会社名：${memberCompany}\nお名前：${memberName}様\n事業概要：${overview}\n会社HP：${website}\n\n【面談メリット】\n${meetingBenefit}\n\nご面談をご検討いただける場合は、本メールにその旨をご返信いただけますでしょうか。私から${memberName}様を加えたメールでおつなぎしますので、その後、日程をご調整いただければ幸いです。\nご返信の際は、件名を変更せずにお願いいたします。\nどうぞよろしくお願いいたします。`;
  const ta=document.getElementById('edit-msg');
  ta.value=defaultMsg;
  document.getElementById('edit-char').textContent=defaultMsg.length+'/2000';
}

function closeDetail(){
  isDetailOpen=false;
  document.getElementById('detail-area').innerHTML='';
}

async function sendRecommendation(r){
  const msg=document.getElementById('edit-msg').value;
  if(!msg.trim()){alert('メッセージを入力してください');return;}
  const sel=document.getElementById('contact-select');
  const idx=sel.value;
  const contact=idx!==''?currentContacts[idx]:null;
  if(!contact){if(!confirm('役職者が選択されていません。既存データから自動検索して送信しますか？'))return;}
  // 送信先と本文の宛名が食い違っていないか確認する（宛名の手直しミス防止）
  if(contact&&contact.name){const head=msg.split('\n\n')[0]||'';const nk=v=>String(v||'').replace(/[\s　]/g,'');if(!nk(head).includes(nk(contact.name))&&!confirm(`本文冒頭の宛名に、送信先の「${contact.name}」様の名前が見当たりません。\n\n送信先：${contact.name}（${contact.email||''}）\n本文の宛名：${head.replace(/\n/g,' ')}\n\nこのまま送信しますか？`))return;}
  const btn=document.getElementById('btn-send');
  btn.textContent='送信中...';btn.disabled=true;
  try{
    const res=await fetch('/.netlify/functions/admin-api',{method:'POST',headers:{'Content-Type':'application/json','x-admin-password':adminPassword},body:JSON.stringify({action:'sendRecommendation',rowIndex:r.rowIndex,targetCompany:r.targetCompany,targetPosition:r.targetPosition,memberCompany:r.memberCompany,memberName:r.memberName,memberEmail:r.memberEmail,memberPosition:r.targetPosition,memberWebsite:currentMemberOverview.website,emailBody:msg,matchReason:r.matchReason,targetContactEmail:contact?.email,targetContactName:contact?.name,targetContactPosition:contact?.position})});
    const data=await res.json();
    if(data.success){closeDetail();alert('推薦メールを送信しました！');loadRequests();}
    else alert('エラー: '+(data.error||'送信失敗'));
  }catch(e){alert('エラー: '+e.message);}
  finally{if(btn){btn.textContent='📨 推薦メールを送信する';btn.disabled=false;}}
}

async function doDecline(r){
  if(!confirm(`${r.targetCompany}への紹介を見送りにしますか？\n会員(${r.memberName})に見送りメールが送信されます。`))return;
  try{
    const res=await fetch('/.netlify/functions/admin-api',{method:'POST',headers:{'Content-Type':'application/json','x-admin-password':adminPassword},body:JSON.stringify({action:'decline',rowIndex:r.rowIndex,memberEmail:r.memberEmail,memberName:r.memberName,targetCompany:r.targetCompany})});
    const data=await res.json();
    if(data.success){alert('見送り処理が完了しました');loadRequests();}
    else alert('エラー: '+data.error);
  }catch(e){alert('エラー: '+e.message);}
}

async function doDelete(r){
  if(!confirm(`このリクエストをゴミ箱に移動しますか？\n（未処理のリクエストを削除すると、会員のリクエスト回数が1回戻ります。見送り・推薦メール送信済みのものは戻りません）`))return;
  try{
    const res=await fetch('/.netlify/functions/admin-api',{method:'POST',headers:{'Content-Type':'application/json','x-admin-password':adminPassword},body:JSON.stringify({action:'delete',rowIndex:r.rowIndex,requestId:r.requestId,userId:r.userId,targetCompany:r.targetCompany,targetPosition:r.targetPosition,status:r.status,createdAt:r.createdAt,updatedAt:r.updatedAt,memberCompany:r.memberCompany,memberName:r.memberName,memberEmail:r.memberEmail,message:r.message,matchReason:r.matchReason,recommendation:r.recommendation})});
    const data=await res.json();
    if(data.success){alert('ゴミ箱に移動しました');loadRequests();}
    else alert('エラー: '+data.error);
  }catch(e){alert('エラー: '+e.message);}
}

async function restoreRequest(r){
  if(!confirm(`このリクエストを復元しますか？`))return;
  try{
    const res=await fetch('/.netlify/functions/admin-api',{method:'POST',headers:{'Content-Type':'application/json','x-admin-password':adminPassword},body:JSON.stringify({action:'restore',rowIndex:r.rowIndex,requestId:r.requestId,userId:r.userId,targetCompany:r.targetCompany,targetPosition:r.targetPosition,status:r.status,createdAt:r.createdAt,updatedAt:r.updatedAt,memberCompany:r.memberCompany,memberName:r.memberName,memberEmail:r.memberEmail,message:r.message,matchReason:r.matchReason,recommendation:r.recommendation})});
    const data=await res.json();
    if(data.success){alert('復元しました');setTab('all');loadRequests();}
    else alert('エラー: '+data.error);
  }catch(e){alert('エラー: '+e.message);}
}
</script>
</body>
</html>
