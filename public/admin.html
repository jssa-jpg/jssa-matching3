<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>JSSA管理画面</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,sans-serif;background:#f3f4f6;color:#1f2937;min-height:100vh;font-size:14px}
.login-wrap{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px}
.login-card{background:#fff;border-radius:16px;padding:40px 36px;max-width:380px;width:100%;box-shadow:0 4px 24px rgba(0,0,0,.12)}
.login-logo{text-align:center;margin-bottom:28px}
.login-badge{background:#639922;color:#fff;font-weight:800;font-size:14px;padding:4px 14px;border-radius:5px;margin-right:8px}
.login-title{font-size:18px;font-weight:700;color:#0B0F1A;display:inline}
.login-sub{font-size:13px;color:#6b7280;text-align:center;margin-bottom:24px}
.field-label{display:block;font-size:12px;font-weight:700;color:#4b5563;margin-bottom:6px}
input[type=password]{width:100%;padding:11px 14px;border:1.5px solid #e5e7eb;border-radius:8px;font-size:14px;outline:none;margin-bottom:16px}
input[type=password]:focus{border-color:#639922}
.btn-login{width:100%;padding:13px;background:#0B0F1A;color:#fff;border:none;border-radius:8px;font-size:15px;font-weight:700;cursor:pointer}
.login-err{color:#dc2626;font-size:13px;margin-top:8px;display:none;text-align:center}
.main-wrap{display:none;min-height:100vh}
header{background:#000F1A;padding:0;position:sticky;top:0;z-index:100}
.hdr{max-width:1100px;margin:0 auto;padding:12px 24px;display:flex;align-items:center;justify-content:space-between}
.logo{display:flex;align-items:center;gap:10px}
.logo-badge{background:#639922;color:#fff;font-weight:800;font-size:12px;padding:3px 10px;border-radius:4px}
.logo-text{color:#fff;font-size:14px;font-weight:500}
.btn-logout{background:rgba(255,255,255,0.1);border:1px solid rgba(255,255,255,0.2);border-radius:6px;padding:6px 14px;font-size:12px;color:rgba(255,255,255,0.7);cursor:pointer}
.container{max-width:1100px;margin:0 auto;padding:24px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:24px}
.stat-card{background:#fff;border-radius:12px;padding:20px;text-align:center;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.stat-num{font-size:28px;font-weight:800;color:#1f2937}
.stat-num.orange{color:#f59e0b}
.stat-num.green{color:#10b981}
.stat-num.red{color:#ef4444}
.stat-label{font-size:12px;color:#6b7280;margin-top:4px}
.tabs{display:flex;gap:8px;margin-bottom:20px;align-items:center;flex-wrap:wrap}
.tab{padding:8px 18px;border-radius:8px;border:none;font-size:13px;font-weight:600;cursor:pointer;background:#fff;color:#6b7280;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.tab.active{background:#0B0F1A;color:#fff}
.tab-trash{background:#fff;color:#ef4444;border:1px solid #fecaca}
.tab-trash.active{background:#ef4444;color:#fff}
.btn-refresh{background:#639922;color:#fff;border:none;border-radius:8px;padding:8px 16px;font-size:12px;font-weight:600;cursor:pointer}
.empty{text-align:center;padding:60px;color:#9ca3af}
.card{background:#fff;border-radius:12px;padding:20px;margin-bottom:12px;box-shadow:0 1px 4px rgba(0,0,0,.06);border:1px solid #e5e7eb}
.card-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:12px}
.card-title{font-size:15px;font-weight:700;color:#0B0F1A}
.card-sub{font-size:12px;color:#6b7280;margin-top:2px}
.badge{display:inline-block;font-size:11px;font-weight:700;padding:3px 10px;border-radius:20px}
.badge-new{background:#fef3c7;color:#92400e}
.badge-done{background:#d1fae5;color:#065f46}
.badge-ng{background:#fee2e2;color:#991b1b}
.badge-trash{background:#fce7f3;color:#9d174d}
.card-body{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.info-item .label{font-size:11px;color:#9ca3af}
.info-item .value{font-size:13px;color:#374151;font-weight:500}
.msg-box{background:#f9fafb;border-radius:8px;padding:12px;font-size:12px;color:#374151;line-height:1.6;margin-bottom:12px;border:1px solid #e5e7eb}
.reason-box{background:#f0f9e8;border-radius:8px;padding:12px;font-size:12px;color:#374151;line-height:1.6;margin-bottom:12px;border:1px solid #c0dd97}
.select-toolbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.applicant-profile{background:#eef6ff;border:1px solid #bfdbfe;border-radius:8px;padding:10px 12px;margin-bottom:12px;font-size:11px;color:#1e3a5f}
.applicant-profile .ap-title{font-size:11px;font-weight:700;color:#1d4ed8;margin-bottom:6px}
.applicant-profile .ap-row{display:flex;flex-wrap:wrap;gap:4px 16px;line-height:1.8}
.applicant-profile b{color:#0B0F1A}
.applicant-profile.empty{color:#6b7280;font-style:italic}
.sel-btns{display:flex;gap:6px}
.sel-btn{background:#fff;border:1px solid #d1d5db;border-radius:6px;padding:4px 10px;font-size:11px;color:#374151;cursor:pointer}
.sel-btn:hover{background:#f3f4f6}
.sel-btn:disabled{opacity:.5;cursor:default}
.sel-count{font-size:11px;color:#6b7280;font-weight:600}
.company-detail-list{display:flex;flex-direction:column;gap:8px;margin-bottom:10px}
.company-card{background:#f9fafb;border:1px solid #e5e7eb;border-radius:8px;padding:10px 12px}
.company-card-head{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.company-card-head input[type=checkbox]{width:16px;height:16px;flex-shrink:0;accent-color:#639922;cursor:pointer}
.company-card-name{font-size:13px;font-weight:700;color:#0B0F1A;cursor:pointer}
.company-card-body{font-size:11px;color:#374151;line-height:1.7}
.company-card-body .cc-row{display:flex;flex-wrap:wrap;gap:4px 14px}
.company-card-body b{color:#111827}
.company-card .reason-box{margin-top:6px}
.load-more-btn{width:100%;background:#fff;border:1px dashed #9ca3af;border-radius:8px;padding:10px;font-size:12px;color:#374151;cursor:pointer;margin-bottom:10px}
.load-more-btn:hover{background:#f3f4f6}
.load-more-btn:disabled{opacity:.6;cursor:default}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.btn-approve{background:#0B0F1A;color:#fff;border:none;border-radius:8px;padding:10px 18px;font-size:13px;font-weight:600;cursor:pointer;flex:1}
.btn-approve:hover{background:#639922}
.btn-decline{background:#fff;color:#ef4444;border:1px solid #fecaca;border-radius:8px;padding:10px 18px;font-size:13px;font-weight:600;cursor:pointer}
.btn-decline:hover{background:#fee2e2}
.btn-delete{background:#fff;color:#9ca3af;border:1px solid #e5e7eb;border-radius:8px;padding:10px 14px;font-size:13px;cursor:pointer}
.btn-delete:hover{background:#fee2e2;color:#ef4444;border-color:#fecaca}
.btn-restore{background:#639922;color:#fff;border:none;border-radius:8px;padding:10px 18px;font-size:13px;font-weight:600;cursor:pointer}
.detail-wrap{display:none;background:#fff;border-radius:12px;padding:24px;margin-bottom:12px;box-shadow:0 2px 8px rgba(0,0,0,.1);border:2px solid #0B0F1A}
.detail-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
.detail-title{font-size:18px;font-weight:700;color:#0B0F1A}
.btn-close{background:#f3f4f6;border:none;border-radius:6px;padding:6px 12px;font-size:12px;cursor:pointer}
.edit-label{font-size:12px;font-weight:700;color:#4b5563;margin-bottom:6px;display:block}
textarea{width:100%;border:1.5px solid #e5e7eb;border-radius:8px;padding:10px 12px;font-size:13px;color:#374151;outline:none;resize:vertical;font-family:inherit}
textarea:focus{border-color:#639922}
.char-count{text-align:right;font-size:11px;color:#9ca3af;margin-top:3px}
.from-box{background:#f0f9e8;border:1px solid #c0dd97;border-radius:8px;padding:12px;margin-bottom:16px}
.from-label{font-size:11px;color:#639922;font-weight:700;margin-bottom:6px}
.from-info{font-size:12px;color:#374151;line-height:2}
.detail-actions{display:flex;gap:10px;margin-top:16px}
.btn-send{flex:2;background:#639922;border:none;border-radius:8px;padding:12px;font-size:14px;font-weight:700;color:#fff;cursor:pointer}
.btn-send:hover{background:#3B6D11}
.btn-send:disabled{background:#9ca3af;cursor:not-allowed}
.btn-cancel{flex:1;background:#fff;border:1px solid #e5e7eb;border-radius:8px;padding:12px;font-size:13px;color:#6b7280;cursor:pointer}
.trash-note{background:#fef3c7;border:1px solid #fde68a;border-radius:8px;padding:10px 14px;font-size:12px;color:#92400e;margin-bottom:16px}
</style>
</head>
<body>
<div class="login-wrap" id="login-wrap">
  <div class="login-card">
    <div class="login-logo"><span class="login-badge">JSSA</span><span class="login-title">管理画面</span></div>
    <p class="login-sub">事務局専用 — パスワードを入力してください</p>
    <label class="field-label">パスワード</label>
    <input type="password" id="pw" placeholder="パスワードを入力" onkeydown="if(event.key==='Enter')doLogin()">
    <button class="btn-login" onclick="doLogin()">ログイン →</button>
    <div class="login-err" id="login-err">パスワードが違います</div>
  </div>
</div>
<div class="main-wrap" id="main-wrap">
  <header>
    <div class="hdr">
      <div class="logo"><span class="logo-badge">JSSA</span><span class="logo-text">管理画面　事務局専用</span></div>
      <button class="btn-logout" onclick="logout()">ログアウト</button>
    </div>
  </header>
  <div class="container">
    <div class="stats">
      <div class="stat-card"><div class="stat-num" id="stat-total">0</div><div class="stat-label">合計依頼数</div></div>
      <div class="stat-card"><div class="stat-num orange" id="stat-new">0</div><div class="stat-label">未処理</div></div>
      <div class="stat-card"><div class="stat-num green" id="stat-done">0</div><div class="stat-label">承認済み</div></div>
      <div class="stat-card"><div class="stat-num red" id="stat-ng">0</div><div class="stat-label">却下</div></div>
    </div>
    <div class="tabs">
      <button class="tab active" onclick="setTab('matches')">📋 マッチング結果</button>
      <button class="tab" onclick="setTab('all')">ユーザー返信</button>
      <button class="tab" onclick="setTab('new')">未処理</button>
      <button class="tab" onclick="setTab('done')">承認済み</button>
      <button class="tab" onclick="setTab('ng')">却下</button>
      <button class="tab tab-trash" onclick="setTab('trash')">🗑 ゴミ箱</button>
      <button class="btn-refresh" onclick="currentTab==='matches'?loadMatchResults():loadRequests()">🔄 更新</button>
    </div>
    <div id="detail-area"></div>
    <div id="cards-area"><div class="empty">読み込み中...</div></div>
  </div>
</div>
<script>
let adminPassword='';
let allRequests=[];
let trashItems=[];
let matchBatches=[];
let currentTab='matches';
let isDetailOpen=false;
let autoRefreshTimer=null;

function doLogin(){
  const pw=document.getElementById('pw').value;
  if(!pw){return;}
  adminPassword=pw;
  document.getElementById('login-err').style.display='none';
  loadMatchResults();
}

function logout(){
  adminPassword='';
  allRequests=[];
  trashItems=[];
  document.getElementById('main-wrap').style.display='none';
  document.getElementById('login-wrap').style.display='flex';
  document.getElementById('pw').value='';
  clearAutoRefresh();
}

function startAutoRefresh(){
  clearAutoRefresh();
  autoRefreshTimer=setInterval(()=>{
    if(!isDetailOpen)loadRequests(true);
  },30000);
}

function clearAutoRefresh(){
  if(autoRefreshTimer){clearInterval(autoRefreshTimer);autoRefreshTimer=null;}
}

async function loadRequests(silent=false){
  try{
    const res=await fetch('/.netlify/functions/admin-api',{method:'POST',headers:{'Content-Type':'application/json','x-admin-password':adminPassword},body:JSON.stringify({action:'list'})});
    const data=await res.json();
    if(!data.success){
      if(data.error==='認証失敗'){document.getElementById('login-err').style.display='block';return;}
      if(!silent)alert('エラー: '+data.error);return;
    }
    allRequests=data.requests||[];
    document.getElementById('login-wrap').style.display='none';
    document.getElementById('main-wrap').style.display='block';
    updateStats();
    renderCards();
    startAutoRefresh();
  }catch(e){
    if(!silent)alert('通信エラー: '+e.message);
  }
}

async function loadMatchResults(){
  try{
    const res=await fetch('/.netlify/functions/admin-api',{method:'POST',headers:{'Content-Type':'application/json','x-admin-password':adminPassword},body:JSON.stringify({action:'getMatchResults'})});
    const data=await res.json();
    if(!data.success){alert('エラー: '+data.error);return;}
    matchBatches=data.batches||[];
    document.getElementById('login-wrap').style.display='none';
    document.getElementById('main-wrap').style.display='block';
    renderCards();
  }catch(e){alert('通信エラー: '+e.message);}
}

let selectedCompanies={}; // batchId -> Set(rowIndex)
let loadedDetails={}; // batchId -> [{rowIndex, company, department, ... , matchReason, recommendation}]

function toggleCompanySelect(batchId,rowIndex,checked){
  if(!selectedCompanies[batchId])selectedCompanies[batchId]=new Set();
  if(checked)selectedCompanies[batchId].add(rowIndex);
  else selectedCompanies[batchId].delete(rowIndex);
  const el=document.getElementById(`selcount-${batchId}`);
  if(el)el.textContent=`${selectedCompanies[batchId].size}社を選択中`;
}

function selectAllLoaded(batchId,checked){
  const loaded=loadedDetails[batchId]||[];
  selectedCompanies[batchId]=new Set(checked?loaded.map(c=>c.rowIndex):[]);
  renderCards();
}

async function loadNextCompanies(batchId){
  const batch=matchBatches.find(b=>b.batchId===batchId);
  if(!batch)return;
  const loaded=loadedDetails[batchId]||[];
  const nextItems=batch.companies.slice(loaded.length,loaded.length+5);
  if(nextItems.length===0)return;
  const btn=document.getElementById(`loadmore-${batchId}`);
  if(btn){btn.disabled=true;btn.textContent='読み込み中…（AIが推薦理由を生成しています）';}
  try{
    const res=await fetch('/.netlify/functions/admin-api',{method:'POST',headers:{'Content-Type':'application/json','x-admin-password':adminPassword},body:JSON.stringify({action:'getCompanyDetails',items:nextItems.map(it=>({company:it.targetCompany,score:it.score,cardRow:it.cardRow})),aiParams:batch.aiParams||{},applicant:{company:batch.userCompany,name:batch.userName,profile:batch.userProfile||{}}})});
    const data=await res.json();
    if(data.success){
      const merged=data.companies.map((c,i)=>({...c,rowIndex:nextItems[i].rowIndex}));
      loadedDetails[batchId]=[...loaded,...merged];
      renderCards();
    }else{
      alert(data.error||'取得に失敗しました');
      if(btn){btn.disabled=false;btn.textContent=loaded.length===0?'詳細を表示（先頭5社）':`次の5社を表示（残り${batch.companies.length-loaded.length}社）`;}
    }
  }catch(e){
    alert('エラー: '+e.message);
    if(btn){btn.disabled=false;btn.textContent=loaded.length===0?'詳細を表示（先頭5社）':`次の5社を表示（残り${batch.companies.length-loaded.length}社）`;}
  }
}

async function changeMemberRank(batch){
  if(!batch.userId){alert('ユーザーIDが取得できませんでした');return;}
  const ranks=['レギュラーライト','レギュラー','プライム','ライト','特待生','投資先'];
  const current=batch.memberRank||'';
  const input=prompt(`新しい会員ランクを、下の選択肢の中から一言一句そのまま入力してください（現在: ${current}）\n\n選択肢: ${ranks.join(' / ')}`,current);
  if(!input)return;
  if(!ranks.includes(input)){alert('入力されたランク名が選択肢と一致しません。もう一度お試しください。');return;}
  if(!confirm(`${batch.userName||batch.userCompany}様の会員ランクを「${input}」に変更します。\n今月の残高も新しいランクの上限にリセットされます。よろしいですか？`))return;
  try{
    const res=await fetch('/.netlify/functions/admin-api',{method:'POST',headers:{'Content-Type':'application/json','x-admin-password':adminPassword},body:JSON.stringify({action:'updateMemberRank',userId:batch.userId,newRank:input})});
    const data=await res.json();
    if(data.success){alert(data.message||'変更しました');loadMatchResults();}
    else{alert(data.error||'処理に失敗しました');}
  }catch(e){alert('エラー: '+e.message);}
}

async function deactivateUser(batch){
  if(!batch.userId){alert('ユーザーIDが取得できませんでした');return;}
  if(!confirm(`${batch.userName||batch.userCompany}様（${batch.userEmail}）を退会処理します。\nログインはできなくなりますが、マイページの登録情報や紹介履歴は削除されず保持されます。\nよろしいですか？`))return;
  try{
    const res=await fetch('/.netlify/functions/admin-api',{method:'POST',headers:{'Content-Type':'application/json','x-admin-password':adminPassword},body:JSON.stringify({action:'deactivateUser',userId:batch.userId})});
    const data=await res.json();
    if(data.success){alert('退会処理をしました');}
    else{alert(data.error||'処理に失敗しました');}
  }catch(e){alert('エラー: '+e.message);}
}

async function sendCompanyNames(batch){
  const selSet=selectedCompanies[batch.batchId];
  if(!selSet||selSet.size===0){alert('送信する企業を1社以上選択してください（チェックボックスで採択してください）');return;}
  const loaded=loadedDetails[batch.batchId]||[];
  const chosenDetailed=loaded.filter(c=>selSet.has(c.rowIndex));
  if(chosenDetailed.length===0){alert('選択した企業の詳細情報が読み込まれていません。もう一度お試しください。');return;}
  if(!confirm(`${batch.userName||batch.userCompany}様に、採択した${chosenDetailed.length}社の企業名と推薦理由をメールで送信します。よろしいですか？`))return;
  try{
    const rowIndexes=chosenDetailed.map(c=>c.rowIndex);
    const companies=chosenDetailed.map(c=>c.company);
    const companyDetails=chosenDetailed.map(c=>({name:c.company,overview:c.features||'',reason:c.recommendation||''}));
    const res=await fetch('/.netlify/functions/admin-api',{method:'POST',headers:{'Content-Type':'application/json','x-admin-password':adminPassword},body:JSON.stringify({action:'sendCompanyNames',batchId:batch.batchId,rowIndexes,userEmail:batch.userEmail,userName:batch.userName,userId:batch.userId,memberRank:batch.memberRank,companies,companyDetails})});
    const data=await res.json();
    if(data.success){alert('企業名一覧を送信しました');delete selectedCompanies[batch.batchId];loadMatchResults();}
    else{alert(data.error||'送信に失敗しました');}
  }catch(e){alert('エラー: '+e.message);}
}

function addRequestFromReply(batch){
  isDetailOpen=true;
  const area=document.getElementById('detail-area');
  const uniqueCompanies=[...new Set((batch.companies||[]).map(c=>c.targetCompany).filter(Boolean))];
  const checkboxes=uniqueCompanies.map((c,i)=>`<label class="ms-item"><input type="checkbox" value="${c.replace(/"/g,'&quot;')}" id="wish-ck-${i}">${c}</label>`).join('');
  area.innerHTML=`<div class="detail-wrap" id="detail-box" style="display:block">
    <div class="detail-head"><div class="detail-title">💬 ユーザー希望企業を登録：${batch.userName||batch.userCompany}様</div><button class="btn-close" onclick="closeDetail()">✕ 閉じる</button></div>
    <label class="edit-label">① マッチ企業の候補から選択（複数選択可）</label>
    <div class="company-list" style="max-height:220px;overflow-y:auto">${checkboxes||'<div style="padding:8px;color:#6b7280;font-size:12px">候補がありません</div>'}</div>
    <label class="edit-label" style="margin-top:12px">② 候補にない企業を追加する場合（1行に1社ずつ入力）</label>
    <textarea id="wish-manual" rows="3" style="width:100%;padding:10px;border-radius:8px;border:1px solid #d1d5db;font-size:13px;margin-bottom:12px" placeholder="候補にない企業名があれば、1行に1社ずつ入力してください"></textarea>
    <div class="detail-actions">
      <button class="btn-cancel" onclick="closeDetail()">キャンセル</button>
      <button class="btn-send" id="wish-submit-btn" onclick='submitWishCompany(${JSON.stringify(batch).replace(/'/g,"&#39;")})'>登録する</button>
    </div>
  </div>`;
  area.scrollIntoView({behavior:'smooth'});
}

async function submitWishCompany(batch){
  const checked=Array.from(document.querySelectorAll('#detail-area input[type=checkbox]:checked')).map(c=>c.value);
  const manual=document.getElementById('wish-manual').value.split('\n').map(s=>s.trim()).filter(Boolean);
  const companies=[...new Set([...checked,...manual])];
  if(companies.length===0){alert('登録する企業を1社以上選択または入力してください');return;}
  const btn=document.getElementById('wish-submit-btn');
  btn.disabled=true;btn.textContent='登録中...';
  try{
    let successCount=0;
    const errors=[];
    for(const company of companies){
      const res=await fetch('/.netlify/functions/admin-api',{method:'POST',headers:{'Content-Type':'application/json','x-admin-password':adminPassword},body:JSON.stringify({action:'addRequest',userId:batch.userId,userCompany:batch.userCompany,userName:batch.userName,userEmail:batch.userEmail,targetCompany:company})});
      const data=await res.json();
      if(data.success)successCount++;else errors.push(`${company}: ${data.error||'失敗'}`);
    }
    closeDetail();
    if(errors.length>0)alert(`${successCount}社を登録しました。\n失敗:\n${errors.join('\n')}`);
    else alert(`${successCount}社を「会いたいリクエスト」に追加しました。「ユーザー返信」タブから役職者選定・プロフィール送信の作業を進めてください。`);
    setTab('all');await loadRequests();
  }catch(e){alert('エラー: '+e.message);}
  finally{if(btn){btn.disabled=false;btn.textContent='登録する';}}
}

async function loadTrash(){
  try{
    const res=await fetch('/.netlify/functions/admin-api',{method:'POST',headers:{'Content-Type':'application/json','x-admin-password':adminPassword},body:JSON.stringify({action:'getTrash'})});
    const data=await res.json();
    if(data.success)trashItems=data.items||[];
    renderCards();
  }catch(e){alert('エラー: '+e.message);}
}

function updateStats(){
  const total=allRequests.length;
  const newCount=allRequests.filter(r=>r.status==='リクエスト受付'||r.status==='未処理').length;
  const done=allRequests.filter(r=>r.status==='推薦メール送信済').length;
  const ng=allRequests.filter(r=>r.status==='見送り').length;
  document.getElementById('stat-total').textContent=total;
  document.getElementById('stat-new').textContent=newCount;
  document.getElementById('stat-done').textContent=done;
  document.getElementById('stat-ng').textContent=ng;
}

function setTab(tab){
  currentTab=tab;
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  if(typeof event!=='undefined'&&event.target)event.target.classList.add('active');
  document.getElementById('detail-area').innerHTML='';
  isDetailOpen=false;
  if(tab==='trash'){loadTrash();}
  else if(tab==='matches'){loadMatchResults();}
  else{renderCards();}
}

function renderCards(){
  const area=document.getElementById('cards-area');
  if(currentTab==='matches'){
    if(matchBatches.length===0){area.innerHTML='<div class="empty">マッチング結果はまだありません</div>';return;}
    area.innerHTML=matchBatches.map(b=>{
      const statusBadge=b.status==='未通知'?'<span class="badge badge-new">⏳ 未通知</span>':'<span class="badge badge-done">✅ 企業名送信済み</span>';
      const loaded=loadedDetails[b.batchId]||[];
      const selSet=selectedCompanies[b.batchId]||new Set();
      const totalCount=b.companies.length;
      const hasMore=loaded.length<totalCount;
      const detailCards=loaded.map(c=>{
        const checked=selSet.has(c.rowIndex)?'checked':'';
        const cid=`cb-${b.batchId}-${c.rowIndex}`;
        return `<div class="company-card">
          <div class="company-card-head">
            <input type="checkbox" id="${cid}" ${checked} onchange="toggleCompanySelect('${b.batchId}',${c.rowIndex},this.checked)">
            <label for="${cid}" class="company-card-name">${c.company||'（企業名不明）'}${c.score?`（マッチ度${c.score}%）`:''}</label>
          </div>
          <div class="company-card-body">
            <div class="cc-row"><span><b>部署:</b> ${c.department||'-'}</span><span><b>役職:</b> ${c.position||'-'}</span><span><b>担当者名:</b> ${c.name||'-'}</span></div>
            <div class="cc-row"><span><b>メール:</b> ${c.email||'-'}</span><span><b>電話:</b> ${c.telOffice||c.telDirect||c.mobile||'-'}</span></div>
            <div class="cc-row"><span><b>住所:</b> ${(c.zip?c.zip+' ':'')}${c.address||'-'}</span></div>
            <div class="cc-row"><span><b>業種:</b> ${c.industry||'-'}</span><span><b>従業員数:</b> ${c.employees||'-'}</span><span><b>設立:</b> ${c.founded||'-'}</span><span><b>資本金:</b> ${c.capital||'-'}</span><span><b>上場:</b> ${c.listed||'未上場'}</span></div>
            <div class="cc-row"><span><b>サイト:</b> ${c.siteUrl?`<a href="${c.siteUrl}" target="_blank" rel="noopener">${c.siteUrl}</a>`:'-'}</span></div>
            <div style="margin-top:6px"><b>会社概要:</b> ${c.features||'情報なし'}</div>
            ${c.matchReason?`<div style="margin-top:4px"><b>マッチ理由:</b> ${c.matchReason}</div>`:''}
            ${c.meetingBenefit?`<div style="margin-top:4px"><b>面談メリット:</b> ${c.meetingBenefit}</div>`:''}
            ${c.recommendation?`<div class="reason-box">🎯 <b>推薦理由:</b> ${c.recommendation}</div>`:''}
            ${!c.found?`<div style="color:#991b1b;margin-top:4px">⚠️ 名刺データが見つかりませんでした（削除・変更された可能性）</div>`:''}
          </div>
        </div>`;
      }).join('');
      const loadMoreLabel=loaded.length===0?'詳細を表示（先頭5社）':`次の5社を表示（残り${totalCount-loaded.length}社）`;
      const up=b.userProfile;
      let profileHtml;
      if(!up||!up.profileType){
        profileHtml=`<div class="applicant-profile empty">プロフィール情報が未登録です</div>`;
      }else if(up.profileType==='startup'){
        const rows=[
          up.fundingRound?`<span><b>調達ラウンド:</b> ${up.fundingRound}</span>`:'',
          up.fundingTarget?`<span><b>調達希望額:</b> ${up.fundingTarget}</span>`:'',
          up.challenges?`<span><b>事業課題:</b> ${up.challenges}</span>`:'',
          up.globalExpansion?`<span><b>海外展開:</b> ${up.globalExpansion}</span>`:'',
          up.kpi?`<span><b>主要KPI:</b> ${up.kpi}</span>`:'',
          up.ma?`<span><b>M&A:</b> ${up.ma}</span>`:'',
          up.stockOption?`<span><b>ストックオプション:</b> ${up.stockOption}</span>`:'',
          up.secondaryMarket?`<span><b>セカンダリーマーケット:</b> ${up.secondaryMarket}</span>`:'',
          up.hiringNeeds?`<span><b>人材採用ニーズ:</b> ${up.hiringNeeds}</span>`:''
        ].filter(Boolean).join('');
        profileHtml=`<div class="applicant-profile"><div class="ap-title">🚀 スタートアップ情報</div><div class="ap-row">${rows||'（未回答）'}</div></div>`;
      }else{
        const rows=[
          up.supportCount?`<span><b>支援実績件数:</b> ${up.supportCount}</span>`:'',
          up.supportArea?`<span><b>得意な支援領域:</b> ${up.supportArea}</span>`:'',
          up.investmentIndustry?`<span><b>投資先・支援先の業種:</b> ${up.investmentIndustry}</span>`:'',
          up.targetRound?`<span><b>対応可能なラウンド:</b> ${up.targetRound}</span>`:'',
          up.ma?`<span><b>M&A:</b> ${up.ma}</span>`:'',
          up.secondaryMarket?`<span><b>セカンダリーマーケット:</b> ${up.secondaryMarket}</span>`:'',
          up.ventureInvestment?`<span><b>ベンチャー投資:</b> ${up.ventureInvestment}</span>`:'',
          up.lpInvestment?`<span><b>LP投資:</b> ${up.lpInvestment}</span>`:'',
          up.hiringNeeds?`<span><b>人材採用ニーズ:</b> ${up.hiringNeeds}</span>`:''
        ].filter(Boolean).join('');
        profileHtml=`<div class="applicant-profile"><div class="ap-title">🤝 支援者情報</div><div class="ap-row">${rows||'（未回答）'}</div></div>`;
      }
      return `<div class="card">
        <div class="card-head">
          <div><div class="card-title">${b.userCompany||'—'} ${b.userName||''}</div><div class="card-sub">${b.userEmail||''} | ${b.createdAt?b.createdAt.slice(0,10):''} | ${totalCount}社マッチ</div></div>
          ${statusBadge}
        </div>
        ${profileHtml}
        ${loaded.length>0?`<div class="select-toolbar">
          <div class="sel-btns">
            <button class="sel-btn" onclick="selectAllLoaded('${b.batchId}',true)">表示中を全選択</button>
            <button class="sel-btn" onclick="selectAllLoaded('${b.batchId}',false)">全解除</button>
          </div>
          <div class="sel-count" id="selcount-${b.batchId}">${selSet.size}社を選択中</div>
        </div>`:''}
        <div class="company-detail-list">${detailCards}</div>
        ${hasMore?`<button class="load-more-btn" id="loadmore-${b.batchId}" onclick="loadNextCompanies('${b.batchId}')">${loadMoreLabel}</button>`:''}
        ${loaded.length>0?`<div class="actions">
          <button class="btn-approve" onclick='sendCompanyNames(${JSON.stringify(b).replace(/'/g,"&#39;")})'>📧 採択した企業だけメール送信</button>
          <button class="btn-decline" onclick='addRequestFromReply(${JSON.stringify(b).replace(/'/g,"&#39;")})'>💬 ユーザー希望企業を登録</button>
        </div>`:''}
        <div class="actions" style="margin-top:6px">
          <button class="sel-btn" onclick='changeMemberRank(${JSON.stringify(b).replace(/'/g,"&#39;")})'>🎖 会員ランクを変更（現在: ${b.memberRank||'default'}）</button>
          <button class="sel-btn" style="color:#991b1b;border-color:#fca5a5" onclick='deactivateUser(${JSON.stringify(b).replace(/'/g,"&#39;")})'>🚫 このユーザーを退会処理する</button>
        </div>
      </div>`;
    }).join('');
    return;
  }
  if(currentTab==='trash'){
    if(trashItems.length===0){area.innerHTML='<div class="empty">ゴミ箱は空です</div>';return;}
    area.innerHTML=trashItems.map(r=>`
      <div class="card">
        <div class="card-head">
          <div><div class="card-title">🗑 ${r.targetCompany||'—'}</div><div class="card-sub">${r.targetPosition||''} | 削除日時: ${r.deletedAt?r.deletedAt.slice(0,10):''}</div></div>
          <span class="badge badge-trash">ゴミ箱</span>
        </div>
        <div class="card-body">
          <div class="info-item"><div class="label">依頼者</div><div class="value">${r.memberCompany||'—'} ${r.memberName||''}</div></div>
          <div class="info-item"><div class="label">元ステータス</div><div class="value">${r.status||'—'}</div></div>
          <div class="info-item"><div class="label">依頼日時</div><div class="value">${r.createdAt?r.createdAt.slice(0,10):''}</div></div>
        </div>
        <div class="trash-note">このリクエストはゴミ箱に移動されました。復元または完全削除できます。</div>
        <div class="actions">
          <button class="btn-restore" onclick='restoreRequest(${JSON.stringify(r).replace(/'/g,"&#39;")})'>↩ 復元</button>
        </div>
      </div>`).join('');
    return;
  }
  let filtered=allRequests;
  if(currentTab==='new')filtered=allRequests.filter(r=>r.status==='リクエスト受付'||r.status==='未処理');
  else if(currentTab==='done')filtered=allRequests.filter(r=>r.status==='推薦メール送信済');
  else if(currentTab==='ng')filtered=allRequests.filter(r=>r.status==='見送り');
  if(filtered.length===0){area.innerHTML='<div class="empty">該当する依頼はありません</div>';return;}
  const getBadge=(s)=>{
    if(s==='リクエスト受付'||s==='未処理')return'<span class="badge badge-new">⏳ 未処理</span>';
    if(s==='推薦メール送信済')return'<span class="badge badge-done">✅ 承認済み</span>';
    if(s==='見送り')return'<span class="badge badge-ng">❌ 見送り</span>';
    return`<span class="badge">${s}</span>`;
  };
  area.innerHTML=filtered.map(r=>`
    <div class="card">
      <div class="card-head">
        <div><div class="card-title">${r.targetCompany||'—'}</div><div class="card-sub">${r.targetPosition||''} | ${r.createdAt?r.createdAt.slice(0,10):''}</div></div>
        ${getBadge(r.status)}
      </div>
      <div class="card-body">
        <div class="info-item"><div class="label">依頼者会社</div><div class="value">${r.memberCompany||'—'}</div></div>
        <div class="info-item"><div class="label">依頼者名</div><div class="value">${r.memberName||'—'}</div></div>
        <div class="info-item"><div class="label">依頼者メール</div><div class="value">${r.memberEmail||'—'}</div></div>
        <div class="info-item"><div class="label">依頼日時</div><div class="value">${r.createdAt?r.createdAt.slice(0,10):''}</div></div>
      </div>
      ${r.matchReason?`<div class="reason-box">🎯 ${r.matchReason}</div>`:''}
      ${r.message?`<div class="msg-box">${r.message}</div>`:''}
      <div class="actions">
        <button class="btn-approve" onclick='openDetail(${JSON.stringify(r).replace(/'/g,"&#39;")})'>✅ 担当者選択</button>
        <button class="btn-decline" onclick='doDecline(${JSON.stringify(r).replace(/'/g,"&#39;")})'>❌ 見送り</button>
        <button class="btn-delete" onclick='doDelete(${JSON.stringify(r).replace(/'/g,"&#39;")})' title="ゴミ箱へ">🗑</button>
      </div>
    </div>`).join('');
}

function openDetail(r){
  isDetailOpen=true;
  const area=document.getElementById('detail-area');
  area.innerHTML=`<div class="detail-wrap" id="detail-box" style="display:block">
    <div class="detail-head"><div class="detail-title">📨 推薦メール送信：${r.targetCompany||''}</div><button class="btn-close" onclick="closeDetail()">✕ 閉じる</button></div>
    <div class="from-box"><div class="from-label">✅ 申請者情報</div><div class="from-info">
      <div><b>会社名：</b>${r.memberCompany||'—'}</div>
      <div><b>氏名　：</b>${r.memberName||'—'}</div>
      <div><b>メール：</b>${r.memberEmail||'—'}</div>
      ${r.matchReason?`<div style="margin-top:8px;color:#639922;font-weight:600">🎯 ${r.matchReason}</div>`:''}
      ${r.recommendation?`<div style="margin-top:4px;color:#374151">${r.recommendation}</div>`:''}
    </div></div>
    <label class="edit-label">① 送信先の役職者を選択</label>
    <select id="contact-select" onchange="onContactChange(${JSON.stringify(r).replace(/'/g,"&#39;")})" style="width:100%;padding:10px;border-radius:8px;border:1px solid #d1d5db;font-size:13px;margin-bottom:12px">
      <option value="">読み込み中...</option>
    </select>
    <label class="edit-label">② メッセージ（自動生成・編集可能）</label>
    <textarea id="edit-msg" rows="12"></textarea>
    <div class="char-count" id="edit-char">0/2000</div>
    <div class="detail-actions">
      <button class="btn-cancel" onclick="closeDetail()">キャンセル</button>
      <button class="btn-send" id="btn-send" onclick='sendRecommendation(${JSON.stringify(r).replace(/'/g,"&#39;")})'>📨 推薦メールを送信する</button>
    </div>
  </div>`;
  document.getElementById('edit-msg').oninput=function(){document.getElementById('edit-char').textContent=this.value.length+'/2000';};
  area.scrollIntoView({behavior:'smooth'});
  currentMemberOverview={website:'',overview:'',meetingBenefit:'',loaded:false};
  loadCompanyContacts(r);
  loadMemberOverview(r);
}

let currentMemberOverview={website:'',overview:'',meetingBenefit:'',loaded:false};

async function loadMemberOverview(r){
  if(!r.userId)return;
  try{
    const res=await fetch('/.netlify/functions/admin-api',{method:'POST',headers:{'Content-Type':'application/json','x-admin-password':adminPassword},body:JSON.stringify({action:'getMemberOverview',userId:r.userId,targetCompany:r.targetCompany,matchReason:r.matchReason})});
    const data=await res.json();
    if(data.success){
      currentMemberOverview={website:data.website||'',overview:data.overview||'',meetingBenefit:data.meetingBenefit||'',loaded:true};
      const sel=document.getElementById('contact-select');
      const idx=sel?sel.value:'';
      const contact=(idx!==''&&currentContacts[idx])?currentContacts[idx]:null;
      buildDefaultMsg(r,contact);
    }
  }catch(e){console.error('loadMemberOverview error:',e);}
}

let currentContacts=[];

async function loadCompanyContacts(r){
  const sel=document.getElementById('contact-select');
  try{
    const res=await fetch('/.netlify/functions/admin-api',{method:'POST',headers:{'Content-Type':'application/json','x-admin-password':adminPassword},body:JSON.stringify({action:'getCompanyContacts',targetCompany:r.targetCompany})});
    const data=await res.json();
    currentContacts=(data.success?data.contacts:[])||[];
    if(currentContacts.length===0){
      sel.innerHTML='<option value="">該当する担当者データが見つかりません（手動でメール本文にメールアドレスを追記してください）</option>';
      buildDefaultMsg(r,null);
      return;
    }
    sel.innerHTML=currentContacts.map((c,i)=>`<option value="${i}">${c.name||'（氏名不明）'} / ${c.position||'役職不明'} / ${c.email||'メール不明'}</option>`).join('');
    sel.value='0';
    buildDefaultMsg(r,currentContacts[0]);
  }catch(e){
    sel.innerHTML='<option value="">読み込みエラー</option>';
  }
}

function onContactChange(r){
  const sel=document.getElementById('contact-select');
  const idx=sel.value;
  const contact=idx!==''?currentContacts[idx]:null;
  buildDefaultMsg(r,contact);
}

function buildDefaultMsg(r,contact){
  const toName=contact?.name||'';
  const toPosition=contact?.position||r.targetPosition||'';
  const addressBlock=`${r.targetCompany||''}\n${toPosition||'ご担当者'}\n${toName?toName+'様':'ご担当者様'}`;
  const memberName=r.memberName||'—';
  const memberCompany=r.memberCompany||'—';
  const purposeLine=r.matchReason?`${memberName}様は${r.matchReason}との接点を希望されており、貴社をご紹介したくご連絡しました。`:`${memberName}様が貴社との面談をご希望されており、ご紹介したくご連絡しました。`;
  const overview=currentMemberOverview.loaded?(currentMemberOverview.overview||'（情報なし）'):'（事業概要を生成中です…）';
  const website=currentMemberOverview.loaded?(currentMemberOverview.website||'（未登録）'):'（読み込み中…）';
  const meetingBenefit=currentMemberOverview.loaded?(currentMemberOverview.meetingBenefit||'（情報なし）'):'（面談メリットを生成中です…）';
  const defaultMsg=`${addressBlock}\n\nいつもお世話になっております。日本スタートアップ支援協会（JSSA）の岡隆宏です。\nこのたび、弊協会の会員企業である${memberCompany}の${memberName}様から、貴社と面談し、情報交換をしたいとのご希望をいただきました。${purposeLine}\n\n【ご紹介する会員】\n会社名：${memberCompany}\nお名前：${memberName}様\n事業概要：${overview}\n会社HP：${website}\n\n【面談メリット】\n${meetingBenefit}\n\nご面談をご検討いただける場合は、本メールにその旨をご返信いただけますでしょうか。私から${memberName}様を加えたメールでおつなぎしますので、その後、日程をご調整いただければ幸いです。\nご返信の際は、件名を変更せずにお願いいたします。\nどうぞよろしくお願いいたします。`;
  const ta=document.getElementById('edit-msg');
  ta.value=defaultMsg;
  document.getElementById('edit-char').textContent=defaultMsg.length+'/2000';
}

function closeDetail(){
  isDetailOpen=false;
  document.getElementById('detail-area').innerHTML='';
}

async function sendRecommendation(r){
  const msg=document.getElementById('edit-msg').value;
  if(!msg.trim()){alert('メッセージを入力してください');return;}
  const sel=document.getElementById('contact-select');
  const idx=sel.value;
  const contact=idx!==''?currentContacts[idx]:null;
  if(!contact){if(!confirm('役職者が選択されていません。既存データから自動検索して送信しますか？'))return;}
  const btn=document.getElementById('btn-send');
  btn.textContent='送信中...';btn.disabled=true;
  try{
    const res=await fetch('/.netlify/functions/admin-api',{method:'POST',headers:{'Content-Type':'application/json','x-admin-password':adminPassword},body:JSON.stringify({action:'sendRecommendation',rowIndex:r.rowIndex,targetCompany:r.targetCompany,targetPosition:r.targetPosition,memberCompany:r.memberCompany,memberName:r.memberName,memberEmail:r.memberEmail,memberPosition:r.targetPosition,memberWebsite:currentMemberOverview.website,emailBody:msg,matchReason:r.matchReason,targetContactEmail:contact?.email,targetContactName:contact?.name,targetContactPosition:contact?.position})});
    const data=await res.json();
    if(data.success){closeDetail();alert('推薦メールを送信しました！');loadRequests();}
    else alert('エラー: '+(data.error||'送信失敗'));
  }catch(e){alert('エラー: '+e.message);}
  finally{if(btn){btn.textContent='📨 推薦メールを送信する';btn.disabled=false;}}
}

async function doDecline(r){
  if(!confirm(`${r.targetCompany}への紹介を見送りにしますか？\n会員(${r.memberName})に見送りメールが送信されます。`))return;
  try{
    const res=await fetch('/.netlify/functions/admin-api',{method:'POST',headers:{'Content-Type':'application/json','x-admin-password':adminPassword},body:JSON.stringify({action:'decline',rowIndex:r.rowIndex,memberEmail:r.memberEmail,memberName:r.memberName,targetCompany:r.targetCompany})});
    const data=await res.json();
    if(data.success){alert('見送り処理が完了しました');loadRequests();}
    else alert('エラー: '+data.error);
  }catch(e){alert('エラー: '+e.message);}
}

async function doDelete(r){
  if(!confirm(`このリクエストをゴミ箱に移動しますか？`))return;
  try{
    const res=await fetch('/.netlify/functions/admin-api',{method:'POST',headers:{'Content-Type':'application/json','x-admin-password':adminPassword},body:JSON.stringify({action:'delete',rowIndex:r.rowIndex,requestId:r.requestId,userId:r.userId,targetCompany:r.targetCompany,targetPosition:r.targetPosition,status:r.status,createdAt:r.createdAt,updatedAt:r.updatedAt,memberCompany:r.memberCompany,memberName:r.memberName,memberEmail:r.memberEmail,message:r.message,matchReason:r.matchReason,recommendation:r.recommendation})});
    const data=await res.json();
    if(data.success){alert('ゴミ箱に移動しました');loadRequests();}
    else alert('エラー: '+data.error);
  }catch(e){alert('エラー: '+e.message);}
}

async function restoreRequest(r){
  if(!confirm(`このリクエストを復元しますか？`))return;
  try{
    const res=await fetch('/.netlify/functions/admin-api',{method:'POST',headers:{'Content-Type':'application/json','x-admin-password':adminPassword},body:JSON.stringify({action:'restore',rowIndex:r.rowIndex,requestId:r.requestId,userId:r.userId,targetCompany:r.targetCompany,targetPosition:r.targetPosition,status:r.status,createdAt:r.createdAt,updatedAt:r.updatedAt,memberCompany:r.memberCompany,memberName:r.memberName,memberEmail:r.memberEmail,message:r.message,matchReason:r.matchReason,recommendation:r.recommendation})});
    const data=await res.json();
    if(data.success){alert('復元しました');setTab('all');loadRequests();}
    else alert('エラー: '+data.error);
  }catch(e){alert('エラー: '+e.message);}
}
