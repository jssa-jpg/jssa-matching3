<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>プロフィール登録 - JSSAエコシステムマッチングツール</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'DM Sans',system-ui,sans-serif;background:#0B0F1A;color:#fff;min-height:100vh}
.header{background:#0B0F1A;border-bottom:0.5px solid rgba(255,255,255,0.07);padding:0 20px;height:50px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
.hlogo{display:flex;align-items:center;gap:8px}
.hmark{width:26px;height:26px;background:#639922;border-radius:5px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:11px;color:#fff}
.htitle{font-size:12px;font-weight:600;color:#fff}
.wrap{max-width:480px;margin:0 auto;padding:24px 16px 60px}
.page-title{font-size:20px;font-weight:700;color:#fff;margin-bottom:6px}
.page-sub{font-size:12px;color:rgba(255,255,255,0.45);margin-bottom:24px;line-height:1.6}
.section{background:rgba(255,255,255,0.04);border:0.5px solid rgba(255,255,255,0.09);border-radius:14px;padding:16px;margin-bottom:14px}
.section-title{font-size:11px;font-weight:600;color:#97C459;letter-spacing:0.08em;text-transform:uppercase;margin-bottom:12px;display:flex;align-items:center;gap:5px}
.frow{margin-bottom:12px}
.flabel{font-size:11px;font-weight:500;color:rgba(255,255,255,0.55);margin-bottom:5px;display:block}
.fsel,.finput{width:100%;background:rgba(255,255,255,0.07);border:0.5px solid rgba(255,255,255,0.12);border-radius:7px;padding:8px 10px;font-size:12px;color:#fff;outline:none;appearance:none;font-family:inherit}
.fsel option{background:#1a2030;color:#fff}
.fsel:focus,.finput:focus{border-color:#639922}
.ms-wrap{position:relative}
.ms-btn{width:100%;background:rgba(255,255,255,0.07);border:0.5px solid rgba(255,255,255,0.12);border-radius:7px;padding:0 10px;font-size:12px;color:rgba(255,255,255,0.45);outline:none;cursor:pointer;display:flex;align-items:center;justify-content:space-between;height:34px;font-family:inherit}
.ms-btn.has-val{color:#fff}
.ms-btn.open{border-color:#639922;border-radius:7px 7px 0 0}
.ms-dd{display:none;position:absolute;top:100%;left:0;right:0;background:#1C2433;border:0.5px solid #639922;border-top:none;border-radius:0 0 7px 7px;z-index:200;max-height:160px;overflow-y:auto}
.ms-dd.open{display:block}
.ms-opt{display:flex;align-items:center;gap:7px;padding:7px 10px;cursor:pointer;font-size:12px;color:rgba(255,255,255,0.7)}
.ms-opt:hover{background:rgba(99,153,34,0.1)}
.ms-opt input{accent-color:#639922;width:12px;height:12px;flex-shrink:0}
.ms-opt.ck{color:#fff;background:rgba(99,153,34,0.08)}
.note{background:rgba(99,153,34,0.08);border:0.5px solid rgba(99,153,34,0.2);border-radius:8px;padding:10px 12px;font-size:11px;color:#97C459;margin-bottom:20px;line-height:1.6}
.skip-btn{width:100%;background:transparent;border:0.5px solid rgba(255,255,255,0.15);border-radius:8px;padding:11px;font-size:12px;color:rgba(255,255,255,0.4);cursor:pointer;margin-bottom:10px;font-family:inherit}
.save-btn{width:100%;background:#639922;border:none;border-radius:8px;padding:13px;font-size:14px;font-weight:700;color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;font-family:inherit}
.save-btn:hover{background:#3B6D11}
.save-btn:disabled{background:#444;cursor:not-allowed}
.type-select{display:flex;gap:8px;margin-bottom:20px}
.type-btn{flex:1;padding:10px;border:0.5px solid rgba(255,255,255,0.15);border-radius:8px;background:transparent;color:rgba(255,255,255,0.5);font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;transition:all .15s}
.type-btn.active{background:rgba(99,153,34,0.15);border-color:#639922;color:#97C459}
</style>
</head>
<body>
<div class="header">
  <div class="hlogo">
    <div class="hmark">J</div>
    <div class="htitle">JSSAエコシステムマッチングツール</div>
  </div>
</div>

<div class="wrap">
  <div class="page-title">プロフィール登録</div>
  <div class="page-sub">以下の情報を入力するとマッチング精度が向上します。<br>全て任意項目です。後からでも変更できます。</div>

  <div class="note">💡 登録した情報はマッチングの参考に使用されます。</div>

  <div style="margin-bottom:16px">
    <div style="font-size:11px;font-weight:600;color:rgba(255,255,255,0.55);margin-bottom:8px">あなたの立場を選択してください</div>
    <div class="type-select">
      <button class="type-btn active" id="type-startup" onclick="setType('startup')">🚀 スタートアップ</button>
      <button class="type-btn" id="type-supporter" onclick="setType('supporter')">🤝 支援者</button>
    </div>
  </div>

  <div id="startup-section">
    <div class="section">
      <div class="section-title">🚀 スタートアップ情報</div>
      <div class="frow">
        <label class="flabel">調達ラウンド</label>
        <select class="fsel" id="fundingRound">
          <option value="">選択してください</option>
          <option>プレシード</option><option>シード</option><option>アーリー</option>
          <option>Series A</option><option>Series B</option><option>Series C</option>
          <option>プレIPO</option><option>未調達</option>
        </select>
      </div>
      <div class="frow">
        <label class="flabel">調達希望額</label>
        <select class="fsel" id="fundingTarget">
          <option value="">選択してください</option>
          <option>〜500万円</option><option>〜1,000万円</option><option>〜3,000万円</option>
          <option>〜5,000万円</option><option>〜7,000万円</option><option>〜1億円</option>
          <option>〜3億円</option><option>3億円以上</option><option>調達予定なし</option>
        </select>
      </div>
      <div class="frow">
        <label class="flabel">事業課題（複数選択可）</label>
        <div class="ms-wrap" id="ms-challenges">
          <button type="button" class="ms-btn" id="ms-challenges-b" onclick="tog('ms-challenges')">
            <span id="ms-challenges-t">選択してください</span><span>▾</span>
          </button>
          <div class="ms-dd" id="ms-challenges-d">
            <label class="ms-opt"><input type="checkbox" value="資金調達" onchange="upd('ms-challenges')">資金調達</label>
            <label class="ms-opt"><input type="checkbox" value="採用・人材" onchange="upd('ms-challenges')">採用・人材</label>
            <label class="ms-opt"><input type="checkbox" value="販路開拓・営業" onchange="upd('ms-challenges')">販路開拓・営業</label>
            <label class="ms-opt"><input type="checkbox" value="技術・開発" onchange="upd('ms-challenges')">技術・開発</label>
            <label class="ms-opt"><input type="checkbox" value="マーケティング" onchange="upd('ms-challenges')">マーケティング</label>
            <label class="ms-opt"><input type="checkbox" value="法務・コンプライアンス" onchange="upd('ms-challenges')">法務・コンプライアンス</label>
            <label class="ms-opt"><input type="checkbox" value="IPO・EXIT" onchange="upd('ms-challenges')">IPO・EXIT</label>
            <label class="ms-opt"><input type="checkbox" value="海外展開" onchange="upd('ms-challenges')">海外展開</label>
          </div>
        </div>
      </div>
      <div class="frow">
        <label class="flabel">海外展開意向</label>
        <select class="fsel" id="globalExpansion">
          <option value="">選択してください</option>
          <option>あり（検討中）</option><option>あり（準備中）</option>
          <option>済（展開済み）</option><option>なし</option>
        </select>
      </div>
      <div class="frow">
        <label class="flabel">M&Aについて</label>
        <select class="fsel" id="ma-startup">
          <option value="">選択してください</option>
          <option>関心がある</option><option>関心はない</option>
        </select>
      </div>
      <div class="frow">
        <label class="flabel">ストックオプションについて</label>
        <select class="fsel" id="stockOption">
          <option value="">選択してください</option>
          <option>関心がある</option><option>関心はない</option><option>導入済み</option>
        </select>
      </div>
      <div class="frow">
        <label class="flabel">セカンダリーマーケットについて</label>
        <select class="fsel" id="secondaryMarket-startup">
          <option value="">選択してください</option>
          <option>関心がある</option><option>関心はない</option>
        </select>
      </div>
      <div class="frow">
        <label class="flabel">人材採用ニーズについて</label>
        <select class="fsel" id="hiringNeeds-startup">
          <option value="">選択してください</option>
          <option>非常にある</option><option>ある</option><option>ない</option>
        </select>
      </div>

    </div>
  </div>

  <div id="supporter-section" style="display:none">
    <div class="section">
      <div class="section-title">🤝 支援者情報</div>
      <div class="frow">
        <label class="flabel">支援実績件数</label>
        <select class="fsel" id="supportCount">
          <option value="">選択してください</option>
          <option>〜5件</option><option>〜10件</option><option>〜30件</option>
          <option>〜50件</option><option>〜100件</option><option>100件以上</option>
        </select>
      </div>
      <div class="frow">
        <label class="flabel">得意な支援領域（複数選択可）</label>
        <div class="ms-wrap" id="ms-supportArea">
          <button type="button" class="ms-btn" id="ms-supportArea-b" onclick="tog('ms-supportArea')">
            <span id="ms-supportArea-t">選択してください</span><span>▾</span>
          </button>
          <div class="ms-dd" id="ms-supportArea-d">
            <label class="ms-opt"><input type="checkbox" value="資金調達・投資" onchange="upd('ms-supportArea')">資金調達・投資</label>
            <label class="ms-opt"><input type="checkbox" value="IPO支援" onchange="upd('ms-supportArea')">IPO支援</label>
            <label class="ms-opt"><input type="checkbox" value="M&A・EXIT支援" onchange="upd('ms-supportArea')">M&A・EXIT支援</label>
            <label class="ms-opt"><input type="checkbox" value="採用・人材支援" onchange="upd('ms-supportArea')">採用・人材支援</label>
            <label class="ms-opt"><input type="checkbox" value="販路開拓・営業支援" onchange="upd('ms-supportArea')">販路開拓・営業支援</label>
            <label class="ms-opt"><input type="checkbox" value="経営戦略・コンサル" onchange="upd('ms-supportArea')">経営戦略・コンサル</label>
            <label class="ms-opt"><input type="checkbox" value="法務・財務支援" onchange="upd('ms-supportArea')">法務・財務支援</label>
            <label class="ms-opt"><input type="checkbox" value="海外展開支援" onchange="upd('ms-supportArea')">海外展開支援</label>
            <label class="ms-opt"><input type="checkbox" value="マーケティング支援" onchange="upd('ms-supportArea')">マーケティング支援</label>
          </div>
        </div>
      </div>
      <div class="frow">
        <label class="flabel">投資先・支援先の業種（複数選択可）</label>
        <div class="ms-wrap" id="ms-investmentIndustry">
          <button type="button" class="ms-btn" id="ms-investmentIndustry-b" onclick="tog('ms-investmentIndustry')">
            <span id="ms-investmentIndustry-t">選択してください</span><span>▾</span>
          </button>
          <div class="ms-dd" id="ms-investmentIndustry-d">
            <label class="ms-opt"><input type="checkbox" value="ITサービス・AI・通信・Web3" onchange="upd('ms-investmentIndustry')">ITサービス・AI・通信・Web3</label>
            <label class="ms-opt"><input type="checkbox" value="医療・ヘルスケア" onchange="upd('ms-investmentIndustry')">医療・ヘルスケア</label>
            <label class="ms-opt"><input type="checkbox" value="製造業・ハードウェア" onchange="upd('ms-investmentIndustry')">製造業・ハードウェア</label>
            <label class="ms-opt"><input type="checkbox" value="環境・エネルギー" onchange="upd('ms-investmentIndustry')">環境・エネルギー</label>
            <label class="ms-opt"><input type="checkbox" value="教育・EdTech" onchange="upd('ms-investmentIndustry')">教育・EdTech</label>
            <label class="ms-opt"><input type="checkbox" value="金融・FinTech" onchange="upd('ms-investmentIndustry')">金融・FinTech</label>
            <label class="ms-opt"><input type="checkbox" value="人材・HR" onchange="upd('ms-investmentIndustry')">人材・HR</label>
            <label class="ms-opt"><input type="checkbox" value="不動産・建設" onchange="upd('ms-investmentIndustry')">不動産・建設</label>
            <label class="ms-opt"><input type="checkbox" value="食品・農業" onchange="upd('ms-investmentIndustry')">食品・農業</label>
            <label class="ms-opt"><input type="checkbox" value="業種不問" onchange="upd('ms-investmentIndustry')">業種不問</label>
          </div>
        </div>
      </div>
      <div class="frow">
        <label class="flabel">対応可能なラウンド（複数選択可）</label>
        <div class="ms-wrap" id="ms-targetRound">
          <button type="button" class="ms-btn" id="ms-targetRound-b" onclick="tog('ms-targetRound')">
            <span id="ms-targetRound-t">選択してください</span><span>▾</span>
          </button>
          <div class="ms-dd" id="ms-targetRound-d">
            <label class="ms-opt"><input type="checkbox" value="プレシード" onchange="upd('ms-targetRound')">プレシード</label>
            <label class="ms-opt"><input type="checkbox" value="シード" onchange="upd('ms-targetRound')">シード</label>
            <label class="ms-opt"><input type="checkbox" value="アーリー" onchange="upd('ms-targetRound')">アーリー</label>
            <label class="ms-opt"><input type="checkbox" value="Series A" onchange="upd('ms-targetRound')">Series A</label>
            <label class="ms-opt"><input type="checkbox" value="Series B" onchange="upd('ms-targetRound')">Series B</label>
            <label class="ms-opt"><input type="checkbox" value="Series C以降" onchange="upd('ms-targetRound')">Series C以降</label>
            <label class="ms-opt"><input type="checkbox" value="プレIPO" onchange="upd('ms-targetRound')">プレIPO</label>
            <label class="ms-opt"><input type="checkbox" value="ラウンド不問" onchange="upd('ms-targetRound')">ラウンド不問</label>
          </div>
        </div>
      </div>
      <div class="frow">
        <label class="flabel">M&Aについて</label>
        <select class="fsel" id="ma-supporter">
          <option value="">選択してください</option>
          <option>関心がある</option><option>関心はない</option>
        </select>
      </div>
      <div class="frow">
        <label class="flabel">セカンダリーマーケットについて</label>
        <select class="fsel" id="secondaryMarket-supporter">
          <option value="">選択してください</option>
          <option>関心がある</option><option>関心はない</option>
        </select>
      </div>
      <div class="frow">
        <label class="flabel">ベンチャー投資について</label>
        <select class="fsel" id="ventureInvestment">
          <option value="">選択してください</option>
          <option>関心がある</option><option>関心はない</option>
        </select>
      </div>
      <div class="frow">
        <label class="flabel">LP投資について</label>
        <select class="fsel" id="lpInvestment">
          <option value="">選択してください</option>
          <option>関心がある</option><option>関心はない</option>
        </select>
      </div>
      <div class="frow">
        <label class="flabel">人材採用ニーズについて</label>
        <select class="fsel" id="hiringNeeds-supporter">
          <option value="">選択してください</option>
          <option>非常にある</option><option>ある</option><option>ない</option>
        </select>
      </div>
    </div>
  </div>

  <button class="save-btn" onclick="save()" id="save-btn">✅ 保存してマッチングアンケートに進む</button>
  <button class="skip-btn" onclick="skip()">スキップしてマッチングへ進む →</button>
</div>

<script>
let userType='startup';
let userCompany='';

function setType(type){
  userType=type;
  document.getElementById('startup-section').style.display=type==='startup'?'block':'none';
  document.getElementById('supporter-section').style.display=type==='supporter'?'block':'none';
  document.getElementById('type-startup').classList.toggle('active',type==='startup');
  document.getElementById('type-supporter').classList.toggle('active',type==='supporter');
}

function tog(id){
  const dd=document.getElementById(id+'-d');
  const bt=document.getElementById(id+'-b');
  const isOpen=dd.classList.contains('open');
  document.querySelectorAll('.ms-dd.open').forEach(d=>{d.classList.remove('open');d.previousElementSibling.classList.remove('open');});
  if(!isOpen){dd.classList.add('open');bt.classList.add('open');}
}
document.addEventListener('click',e=>{
  if(!e.target.closest('.ms-wrap')){
    document.querySelectorAll('.ms-dd.open').forEach(d=>{d.classList.remove('open');d.previousElementSibling.classList.remove('open');});
  }
});

function upd(id){
  const cks=document.querySelectorAll('#'+id+'-d input:checked');
  const vals=Array.from(cks).map(c=>c.value);
  const tx=document.getElementById(id+'-t');
  const bt=document.getElementById(id+'-b');
  tx.textContent=vals.length===0?'選択してください':vals.length===1?vals[0]:vals.length+'件選択中';
  bt.classList.toggle('has-val',vals.length>0);
  document.querySelectorAll('#'+id+'-d .ms-opt').forEach(o=>o.classList.toggle('ck',o.querySelector('input').checked));
}

function getMs(id){
  return Array.from(document.querySelectorAll('#'+id+'-d input:checked')).map(c=>c.value).join('、');
}

async function save(){
  const btn=document.getElementById('save-btn');
  btn.disabled=true;btn.textContent='保存中...';

  const profile={
    fundingRound:userType==='startup'?(document.getElementById('fundingRound').value||''):'',
    fundingTarget:userType==='startup'?(document.getElementById('fundingTarget').value||''):'',
    challenges:userType==='startup'?getMs('ms-challenges'):'',
    globalExpansion:userType==='startup'?(document.getElementById('globalExpansion').value||''):'',

    supportCount:userType==='supporter'?(document.getElementById('supportCount').value||''):'',
    supportArea:userType==='supporter'?getMs('ms-supportArea'):'',
    investmentIndustry:userType==='supporter'?getMs('ms-investmentIndustry'):'',
    targetRound:userType==='supporter'?getMs('ms-targetRound'):'',

    ma:userType==='startup'?(document.getElementById('ma-startup').value||''):(document.getElementById('ma-supporter').value||''),
    secondaryMarket:userType==='startup'?(document.getElementById('secondaryMarket-startup').value||''):(document.getElementById('secondaryMarket-supporter').value||''),
    hiringNeeds:userType==='startup'?(document.getElementById('hiringNeeds-startup').value||''):(document.getElementById('hiringNeeds-supporter').value||''),
    stockOption:userType==='startup'?(document.getElementById('stockOption').value||''):'',
    ventureInvestment:userType==='supporter'?(document.getElementById('ventureInvestment').value||''):'',
    lpInvestment:userType==='supporter'?(document.getElementById('lpInvestment').value||''):''
  };

  try{
    const userStr=sessionStorage.getItem('jssa_user');
    const user=userStr?JSON.parse(userStr):{};
    const company=user.company||sessionStorage.getItem('jssa_company')||userCompany;
    const userId=user.id||'';

    const res=await fetch('/.netlify/functions/save-profile',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({userId,company,profile})
    });
    const data=await res.json();
    if(data.success){
      // セッションのprofileを更新
      if(userStr){
        const updatedUser=Object.assign({},JSON.parse(userStr),{profile});
        sessionStorage.setItem('jssa_user',JSON.stringify(updatedUser));
      }
      sessionStorage.setItem('jssa_profile_done','1');
      window.location.href='/';
    }else{
      alert('エラー: '+(data.error||'保存に失敗しました'));
      btn.disabled=false;btn.textContent='✅ 保存してマッチングアンケートに進む';
    }
  }catch(e){
    alert('エラー: '+e.message);
    btn.disabled=false;btn.textContent='✅ 保存してマッチングアンケートに進む';
  }
}

function skip(){
  sessionStorage.setItem('jssa_profile_done','1');
  window.location.href='/';
}

window.addEventListener('DOMContentLoaded',()=>{
  const userStr=sessionStorage.getItem('jssa_user');
  const user=userStr?JSON.parse(userStr):{};
  const profile=user.profile||{};
  userCompany=user.company||'';

  // プロフィール情報をデフォルト表示
  if(profile.fundingRound)document.getElementById('fundingRound').value=profile.fundingRound;
  if(profile.fundingTarget)document.getElementById('fundingTarget').value=profile.fundingTarget;
  if(profile.globalExpansion)document.getElementById('globalExpansion').value=profile.globalExpansion;
  if(profile.kpi){const kpiEl=document.getElementById('kpi');if(kpiEl)kpiEl.value=profile.kpi;}
  if(profile.supportCount)document.getElementById('supportCount').value=profile.supportCount;
  if(profile.ma){const a=document.getElementById('ma-startup');if(a)a.value=profile.ma;const b=document.getElementById('ma-supporter');if(b)b.value=profile.ma;}
  if(profile.secondaryMarket){const a=document.getElementById('secondaryMarket-startup');if(a)a.value=profile.secondaryMarket;const b=document.getElementById('secondaryMarket-supporter');if(b)b.value=profile.secondaryMarket;}
  if(profile.hiringNeeds){const a=document.getElementById('hiringNeeds-startup');if(a)a.value=profile.hiringNeeds;const b=document.getElementById('hiringNeeds-supporter');if(b)b.value=profile.hiringNeeds;}
  if(profile.stockOption)document.getElementById('stockOption').value=profile.stockOption;
  if(profile.ventureInvestment)document.getElementById('ventureInvestment').value=profile.ventureInvestment;
  if(profile.lpInvestment)document.getElementById('lpInvestment').value=profile.lpInvestment;

  // 複数選択項目の復元
  const msMap={
    'ms-challenges':'challenges',
    'ms-supportArea':'supportArea',
    'ms-investmentIndustry':'investmentIndustry',
    'ms-targetRound':'targetRound'
  };
  Object.keys(msMap).forEach(id=>{
    const key=msMap[id];
    const saved=profile[key]||'';
    if(saved){
      const vals=saved.split('、');
      document.querySelectorAll('#'+id+'-d input[type=checkbox]').forEach(c=>{
        if(vals.includes(c.value)){c.checked=true;}
      });
      upd(id);
    }
  });
});
</script>
</body>
</html>
